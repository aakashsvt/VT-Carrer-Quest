/* --- Mini-Game 1: Neon Table Tennis --- */
function startTTGame() {
  stopActiveGame();
  // Portrait phones get a taller table so the paddle has more room to travel
  var W = 460, H = (innerWidth <= 600 && innerHeight > innerWidth) ? 340 : 260;
  var m = $("modal");
  m.innerHTML = '<div class="card arcade-modal" role="dialog" aria-label="Neon Table Tennis">' +
    '<div class="arcade-game-container">' +
      '<div class="arcade-game-top">' +
        '<div class="arcade-game-title">🏓 Neon Table Tennis</div>' +
        '<button class="btn alt arcade-sub-btn" id="tt-back-btn">&larr; Games Menu</button>' +
      '</div>' +
      '<div class="game-hud-bar">' +
        '<span style="color:#38bdf8">BOT: <span id="tt-bot-score">0</span></span>' +
        '<span style="color:#facc15" id="tt-status">FIRST TO 3 WINS</span>' +
        '<span style="color:#f97316">YOU: <span id="tt-you-score">0</span></span>' +
      '</div>' +
      '<div class="arcade-canvas-wrap">' +
        '<canvas id="tt-canvas" width="' + W + '" height="' + H + '" style="aspect-ratio:' + W + ' / ' + H + '"></canvas>' +
      '</div>' +
      '<div class="game-controls-hint">Move right paddle with mouse / touch or ↑ ↓ / W S keys</div>' +
    '</div>' +
  '</div>';

  $("tt-back-btn").onclick = openLounge;

  var canvas = $("tt-canvas");
  if (!canvas) return;
  var ctx = canvas.getContext("2d");

  // All speeds are table pixels per second, so every screen refresh rate plays the same
  var SERVE_SPEED = 215, RALLY_SPEED = 285, SPEED_PER_HIT = 7, MAX_SPEED = 400;
  var SPEED_EASE = 0.6;      // Seconds for the ball to settle into a new speed
  var MAX_STEP = 1 / 120;    // Longest physics step
  var MAX_ANGLE = Math.PI / 6;
  var COUNT_TIME = 0.6;      // Length of each 3-2-1 beat
  var POINT_PAUSE = 1.2;     // Breather between points
  var TRAIL_TIME = 0.1;
  var RIPPLE_TIME = 0.28;

  // Bot on LEFT (x = 18), User Player on RIGHT (x = W - 18 - player.w)
  var PADDLE_X = 18, PADDLE_W = 9, PADDLE_H = 54, EDGE = 4;
  var bot = { y: (H - PADDLE_H) / 2, h: PADDLE_H, w: PADDLE_W, score: 0, aimY: (H - PADDLE_H) / 2, flash: 0 };
  var player = { y: (H - PADDLE_H) / 2, target: (H - PADDLE_H) / 2, h: PADDLE_H, w: PADDLE_W, score: 0, flash: 0 };
  var ball = { x: W / 2, y: H / 2, dx: 1, dy: 0, speed: SERVE_SPEED, r: 5, trail: [] };

  var phase = "serve", serveDir = 1, serveTimer = 0, serveLabel = null, serveColor = "#ffffff";
  var targetSpeed = RALLY_SPEED, rally = 0, clock = 0;
  var winner = null, ripples = [], keys = {};
  var last = 0, scale = 1, fit = canvasScaler(canvas, W, H);

  function clampPaddle(y) { return clamp(y, EDGE, H - PADDLE_H - EDGE); }

  function setStatus(text) {
    var el = $("tt-status");
    if (el && el.textContent !== text) el.textContent = text;
  }

  function prepareServe(dir, label, color) {
    phase = "serve";
    serveDir = dir;
    serveLabel = label;
    serveColor = color || "#ffffff";
    serveTimer = label ? POINT_PAUSE : COUNT_TIME * 3;
    ball.x = W / 2;
    ball.y = H / 2;
    ball.speed = SERVE_SPEED;
    ball.trail = [];
    rally = 0;
    targetSpeed = RALLY_SPEED;
    if (!label) setStatus("FIRST TO 3 WINS");
  }

  function launchBall() {
    phase = "play";
    // Controlled serve angle (±15° max) so the first return is always readable
    var angle = (Math.random() * 2 - 1) * Math.PI / 12;
    ball.dx = serveDir * Math.cos(angle);
    ball.dy = Math.sin(angle);
    if (serveLabel) setStatus("FIRST TO 3 WINS");
    if (serveDir < 0) aimBot(0.2);
    beep(360);
  }

  // Where the ball will cross the bot's paddle, following wall bounces
  function predictBotY() {
    var lo = EDGE + ball.r, span = H - EDGE - ball.r - lo;
    var y = ball.y + ball.dy / Math.abs(ball.dx) * (ball.x - (PADDLE_X + PADDLE_W + ball.r)) - lo;
    y = ((y % (2 * span)) + 2 * span) % (2 * span);
    return lo + (y > span ? 2 * span - y : y);
  }

  // The bot misjudges more as the rally speeds up and when returns come off the paddle's edge,
  // so long rallies and angled shots are how the player wins points
  function aimBot(shotDifficulty) {
    var pace = (targetSpeed - RALLY_SPEED) / (MAX_SPEED - RALLY_SPEED);
    var spread = 16 + 34 * pace + 26 * shotDifficulty;
    bot.aimY = clampPaddle(predictBotY() + (Math.random() * 2 - 1) * spread - bot.h / 2);
  }

  // The ball turns around where it is; snapping it to the paddle face would read as a speed spike
  function hitBall(p, dir, tone, color) {
    var offset = clamp((ball.y - (p.y + p.h / 2)) / (p.h / 2), -1, 1);
    var angle = offset * MAX_ANGLE;
    ball.dx = dir * Math.cos(angle);
    ball.dy = Math.sin(angle);
    rally++;
    // Only the target moves here; the ball eases toward it so no hit causes a visible jump
    targetSpeed = Math.min(MAX_SPEED, RALLY_SPEED + rally * SPEED_PER_HIT);
    p.flash = 1;
    if (!RM) ripples.push({ x: ball.x, y: ball.y, age: 0, c: color });
    if (rally >= 2) setStatus("RALLY " + rally);
    beep(tone);
    return offset;
  }

  function pointTo(scorer) {
    scorer.score++;
    var youScored = scorer === player;
    $(youScored ? "tt-you-score" : "tt-bot-score").textContent = scorer.score;
    beep(youScored ? 740 : 300);
    if (scorer.score >= 3) {
      phase = "over";
      winner = youScored ? "Player" : "Studio Bot";
      setStatus(youScored ? "YOU WON MATCH!" : "BOT WINS MATCH");
      if (youScored) beep(920);
      return;
    }
    // Next serve goes to whoever just lost the point
    setStatus(youScored ? "NICE SHOT!" : "GET READY");
    prepareServe(youScored ? -1 : 1, youScored ? "YOU SCORED" : "BOT SCORED", youScored ? "#f97316" : "#38bdf8");
  }

  function onPointerMove(e) {
    var rect = canvas.getBoundingClientRect();
    if (!rect.height) return;
    var my = (e.clientY - rect.top) * H / rect.height;
    // Moves the USER player paddle on the RIGHT
    player.target = clampPaddle(my - player.h / 2);
  }

  function onKeyDown(e) {
    keys[e.key] = true;
    if (e.key === "ArrowUp" || e.key === "ArrowDown") e.preventDefault();
  }
  function onKeyUp(e) { keys[e.key] = false; }

  // Listening on window keeps the paddle under control if the mouse drifts off the table
  window.addEventListener("pointermove", onPointerMove);
  canvas.addEventListener("pointerdown", onPointerMove);
  window.addEventListener("keydown", onKeyDown);
  window.addEventListener("keyup", onKeyUp);

  gameCleanup = function() {
    window.removeEventListener("pointermove", onPointerMove);
    window.removeEventListener("keydown", onKeyDown);
    window.removeEventListener("keyup", onKeyUp);
  };

  canvas.addEventListener("click", function() {
    if (phase === "over") {
      player.score = 0; bot.score = 0; winner = null;
      $("tt-you-score").textContent = "0";
      $("tt-bot-score").textContent = "0";
      prepareServe(1, null);
    }
  });

  function update(h) {
    clock += h;

    // User controls right paddle with keys
    if (keys["ArrowUp"] || keys["w"] || keys["W"]) player.target = clampPaddle(player.target - 360 * h);
    if (keys["ArrowDown"] || keys["s"] || keys["S"]) player.target = clampPaddle(player.target + 360 * h);
    player.y += (player.target - player.y) * ease(35, h);

    player.flash = Math.max(0, player.flash - h * 4);
    bot.flash = Math.max(0, bot.flash - h * 4);
    for (var i = ripples.length - 1; i >= 0; i--) {
      ripples[i].age += h;
      if (ripples[i].age > RIPPLE_TIME) ripples.splice(i, 1);
    }

    if (phase === "over") return;

    // Bot controls left paddle: waits a beat, glides to its read of the ball, drifts home otherwise
    var pace = (targetSpeed - RALLY_SPEED) / (MAX_SPEED - RALLY_SPEED);
    var incoming = phase === "play" && ball.dx < 0;
    var botGoal = incoming && ball.x < W * 0.75 ? bot.aimY : incoming ? bot.y : (H - bot.h) / 2;
    var botMax = (230 + 90 * pace) * h;
    bot.y = clampPaddle(bot.y + clamp((botGoal - bot.y) * ease(incoming ? 10 : 3, h), -botMax, botMax));

    if (phase === "serve") {
      serveTimer -= h;
      if (serveTimer <= 0) launchBall();
      return;
    }

    ball.speed += (targetSpeed - ball.speed) * ease(1 / SPEED_EASE, h);
    ball.x += ball.dx * ball.speed * h;
    ball.y += ball.dy * ball.speed * h;

    // Top and bottom table cushion bounce
    if (ball.y - ball.r <= EDGE) {
      ball.y = EDGE + ball.r;
      ball.dy = Math.abs(ball.dy);
      beep(240);
    } else if (ball.y + ball.r >= H - EDGE) {
      ball.y = H - EDGE - ball.r;
      ball.dy = -Math.abs(ball.dy);
      beep(240);
    }

    // Left Paddle Collision (BOT)
    var botFace = PADDLE_X + bot.w;
    if (ball.dx < 0 && ball.x - ball.r <= botFace && ball.x + ball.r >= PADDLE_X &&
        Math.abs(ball.y - (bot.y + bot.h / 2)) <= bot.h / 2 + ball.r) {
      hitBall(bot, 1, 420, "#38bdf8");
    }

    // Right Paddle Collision (USER PLAYER)
    var playerFace = W - PADDLE_X - player.w;
    if (ball.dx > 0 && ball.x + ball.r >= playerFace && ball.x - ball.r <= W - PADDLE_X &&
        Math.abs(ball.y - (player.y + player.h / 2)) <= player.h / 2 + ball.r) {
      aimBot(Math.abs(hitBall(player, -1, 480, "#f97316")));
    }

    // Scoring
    if (ball.x < -10) pointTo(player);
    else if (ball.x > W + 10) pointTo(bot);
  }

  function drawPaddle(x, p, color) {
    ctx.shadowColor = color;
    ctx.shadowBlur = (14 + 20 * p.flash) * scale;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(x, p.y, p.w, p.h, 4);
    ctx.fill();
    if (p.flash > 0) {
      ctx.fillStyle = "rgba(255,255,255," + (p.flash * 0.7) + ")";
      ctx.fill();
    }
  }

  function draw() {
    scale = fit();
    ctx.setTransform(scale, 0, 0, scale, 0, 0);

    ctx.fillStyle = "#0c1527";
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = "#1d4ed8";
    ctx.lineWidth = 3;
    ctx.strokeRect(EDGE, EDGE, W - EDGE * 2, H - EDGE * 2);

    ctx.strokeStyle = "rgba(255,255,255,0.04)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(EDGE, H / 2); ctx.lineTo(W - EDGE, H / 2);
    ctx.stroke();

    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(W / 2, EDGE); ctx.lineTo(W / 2, H - EDGE);
    ctx.stroke();
    ctx.setLineDash([]);

    // Hit ripples
    for (var r = 0; r < ripples.length; r++) {
      var rp = ripples[r], grow = rp.age / RIPPLE_TIME;
      ctx.globalAlpha = (1 - grow) * 0.7;
      ctx.strokeStyle = rp.c;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(rp.x, rp.y, ball.r + grow * 20, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Ball trail
    for (var i = 0; i < ball.trail.length; i++) {
      var tr = ball.trail[i], fade = 1 - (clock - tr.t) / TRAIL_TIME;
      ctx.fillStyle = "rgba(56, 189, 248, " + (fade * 0.4) + ")";
      ctx.beginPath();
      ctx.arc(tr.x, tr.y, ball.r * (0.6 + 0.4 * fade), 0, Math.PI * 2);
      ctx.fill();
    }

    // Ball (breathes gently while waiting to be served)
    var waiting = phase === "serve";
    ctx.shadowColor = "#38bdf8";
    ctx.shadowBlur = 12 * scale;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r * (waiting && !RM ? 1 + 0.18 * Math.sin(clock * 7) : 1), 0, Math.PI * 2);
    ctx.fill();

    // Left Paddle (BOT - Cyan), Right Paddle (USER PLAYER - Orange)
    drawPaddle(PADDLE_X, bot, "#38bdf8");
    drawPaddle(W - PADDLE_X - player.w, player, "#f97316");
    ctx.shadowBlur = 0;

    if (waiting) {
      ctx.textAlign = "center";
      if (serveLabel) {
        ctx.font = "bold 20px 'Space Grotesk', sans-serif";
        ctx.fillStyle = serveColor;
        ctx.fillText(serveLabel, W / 2, H / 2 - 34);
      } else {
        ctx.font = "bold 34px 'Space Grotesk', sans-serif";
        ctx.fillStyle = "#facc15";
        ctx.fillText(Math.max(1, Math.ceil(serveTimer / COUNT_TIME)), W / 2, H / 2 - 28);
      }
    }

    if (phase === "over") {
      ctx.fillStyle = "rgba(8, 12, 22, 0.82)";
      ctx.fillRect(0, 0, W, H);
      ctx.font = "bold 22px 'Space Grotesk', sans-serif";
      ctx.textAlign = "center";
      ctx.fillStyle = winner === 'Player' ? "#f97316" : "#38bdf8";
      ctx.fillText(winner === 'Player' ? "🏆 YOU WON!" : "BOT WINS", W / 2, H / 2 - 12);
      ctx.font = "13px 'Space Grotesk', sans-serif";
      ctx.fillStyle = "#cbd5e1";
      ctx.fillText("Tap or click the table to play again", W / 2, H / 2 + 18);
    }
  }

  function loop(now) {
    var dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
    last = now;

    var steps = Math.max(1, Math.ceil(dt / MAX_STEP)), h = dt / steps;
    for (var s = 0; s < steps; s++) update(h);

    if (phase === "play") ball.trail.push({ x: ball.x, y: ball.y, t: clock });
    while (ball.trail.length && clock - ball.trail[0].t > TRAIL_TIME) ball.trail.shift();

    draw();
    activeGameLoop = requestAnimationFrame(loop);
  }

  prepareServe(1, null);
  activeGameLoop = requestAnimationFrame(loop);
}

/* --- Mini-Game 2: Cyber Arcade Blaster --- */
function startBlasterGame() {
  stopActiveGame();
  // Portrait phones get a narrow, tall arena: everything draws larger and there's more time to react
  var tall = innerWidth <= 600 && innerHeight > innerWidth;
  var W = tall ? 340 : 460, H = tall ? 430 : 290;
  var m = $("modal");
  m.innerHTML = '<div class="card arcade-modal" role="dialog" aria-label="Cyber Arcade Blaster">' +
    '<div class="arcade-game-container">' +
      '<div class="arcade-game-top">' +
        '<div class="arcade-game-title">👾 Cyber Arcade Blaster</div>' +
        '<button class="btn alt arcade-sub-btn" id="blaster-back-btn">&larr; Games Menu</button>' +
      '</div>' +
      '<div class="game-hud-bar">' +
        '<span style="color:#38bdf8">SCORE: <span id="bl-score" style="display:inline-block">0</span></span>' +
        '<span style="color:#f43f5e" id="bl-lives">❤❤❤</span>' +
        '<span style="color:#facc15" id="bl-wave">WAVE 1/3</span>' +
      '</div>' +
      '<div class="arcade-canvas-wrap orange-border">' +
        '<canvas id="blaster-canvas" width="' + W + '" height="' + H + '" style="aspect-ratio:' + W + ' / ' + H + '"></canvas>' +
      '</div>' +
      '<div class="game-controls-hint">Drag / mouse / ← → · Auto-fire · Gold chips = triple shot</div>' +
    '</div>' +
  '</div>';

  $("blaster-back-btn").onclick = openLounge;

  var canvas = $("blaster-canvas");
  if (!canvas) return;
  var ctx = canvas.getContext("2d");
  var fit = canvasScaler(canvas, W, H);

  // Speeds are pixels per second; "fall" is a share of the arena height per second,
  // so a bug takes the same time to arrive on every screen and refresh rate
  var MAX_STEP = 1 / 120, FIRE_RATE = 0.17, BULLET_SPEED = 560, SHIP_R = 8;
  var COUNT_TIME = 0.6, BANNER_TIME = 1.3, WAVE_BREAK = 1.1, COMBO_TIME = 1.8, POWER_TIME = 8, INVULN_TIME = 1.6;
  var MAX_PARTICLES = 220;
  var KIND = {
    scout:  { r: 11, hp: 1, pts: 10, fall: 0.24, c: "#f43f5e" },
    darter: { r: 9, hp: 1, pts: 20, fall: 0.46, c: "#a855f7" },
    tank:   { r: 16, hp: 5, pts: 50, fall: 0.13, c: "#10b981" },
    boss:   { r: 34, hp: 80, pts: 500, fall: 0, c: "#f97316" }
  };
  var WAVE_NAMES = ["WAVE 1", "WAVE 2", "WAVE 3", "⚠ HIVE MOTHER"];

  var ship = { x: W / 2, target: W / 2, y: H - 30, bank: 0, recoil: 0, muzzle: 0 };
  var enemies, bullets, shots, chips, particles, rings, floats, events;
  var phase, wave, waveT, breakT, countT, finaleT, overT, won, boss, banner;
  var score, lives, combo, comboT, powerT, invuln, fireT, isBest;
  var clock = 0, slowT = 0, shake = 0, shakeX = 0, shakeY = 0, hurtFlash = 0, warp = 0;
  var last = 0, keys = {}, touchX = null, glowCache = {}, bg = null;

  var stars = [];
  for (var i = 0; i < 54; i++) {
    var layer = i % 3;
    stars.push({ x: Math.random() * W, y: Math.random() * H, speed: 16 + layer * 26, size: 0.8 + layer * 0.5, a: 0.3 + layer * 0.25 });
  }

  function setLives() { $("bl-lives").textContent = "❤❤❤".slice(0, Math.max(0, lives)) || "–"; }
  function setWave(text) { $("bl-wave").textContent = text; }
  function setScore(pop) {
    var el = $("bl-score");
    el.textContent = score;
    if (pop && !RM) el.animate([{ transform: "scale(1.4)", color: "#ffffff" }, { transform: "scale(1)" }], { duration: 200, easing: "ease-out" });
  }

  function newGame() {
    enemies = []; bullets = []; shots = []; chips = []; particles = []; rings = []; floats = []; events = [];
    phase = "count"; wave = -1; waveT = 0; breakT = 0; countT = COUNT_TIME * 3; finaleT = 0; overT = 0;
    won = false; boss = null; banner = null; isBest = false;
    score = 0; lives = 3; combo = 0; comboT = 0; powerT = 0; invuln = 0; fireT = 0;
    setScore(); setLives(); setWave("WAVE 1/3");
  }

  /* Spawning */
  function spawn(kind, x, y) {
    var k = KIND[kind], margin = k.r + 34;
    var en = {
      kind: kind, r: k.r, hp: k.hp, maxHp: k.hp, pts: k.pts, fall: k.fall, c: k.c,
      x: x, baseX: clamp(x, margin, W - margin), y: y === undefined ? -k.r - 6 : y,
      t: 0, phase: 0, vx: 0, flash: 0, fireT: 1 + Math.random() * 1.2, adds: 2, dead: false
    };
    enemies.push(en);
    return en;
  }

  function waveEvents(w) {
    var ev = [];
    function at(t, fn) { ev.push({ t: t, fn: fn }); }
    function row(t, kind, count) {
      at(t, function() {
        var phase0 = Math.random() * 6;
        for (var i = 0; i < count; i++) spawn(kind, 56 + (W - 112) * i / (count - 1)).phase = phase0;
      });
    }
    function vee(t, kind, count) {
      at(t, function() {
        var mid = (count - 1) / 2, cx = 110 + Math.random() * (W - 220), phase0 = Math.random() * 6;
        for (var i = 0; i < count; i++) spawn(kind, cx + (i - mid) * 34, -18 - Math.abs(i - mid) * 24).phase = phase0;
      });
    }
    function stream(t, kind, count) {
      var x = 70 + Math.random() * (W - 140);
      for (var i = 0; i < count; i++) at(t + i * 0.34, function() { spawn(kind, x); });
    }
    function tank(t, x) { at(t, function() { spawn("tank", x); }); }
    function chip(t) { at(t, function() { chips.push({ x: 50 + Math.random() * (W - 100), y: -12, t: 0, dead: false }); }); }

    if (w === 0) {
      row(0.4, "scout", 5); stream(3, "scout", 6); chip(4.4); vee(6, "scout", 5);
    } else if (w === 1) {
      vee(0.4, "scout", 5); stream(2.6, "darter", 4); row(4.8, "scout", 6); chip(5.6); tank(7, W / 2); stream(8.2, "darter", 5);
    } else if (w === 2) {
      tank(0.4, W * 0.28); tank(0.4, W * 0.72); row(2.4, "scout", 6); stream(4.2, "darter", 6); chip(5);
      vee(6.4, "scout", 7); tank(8, W / 2); stream(9, "darter", 6);
    } else {
      at(0.2, function() { boss = spawn("boss", W / 2, -50); });
      chip(6); chip(14);
    }
    ev.sort(function(a, b) { return a.t - b.t; });
    return ev;
  }

  function startWave(w) {
    wave = w;
    waveT = 0;
    breakT = 0;
    events = waveEvents(w);
    banner = { text: WAVE_NAMES[w], age: 0, c: w === 3 ? "#f97316" : "#38bdf8" };
    warp = 1;
    setWave(w === 3 ? "BOSS" : "WAVE " + (w + 1) + "/3");
    beep(w === 3 ? 220 : 500);
    // A spare life before the boss keeps the finale fair for newer players
    if (w === 3 && lives < 3) {
      lives++;
      setLives();
      floatText(W / 2, H * 0.55, "+1 LIFE", "#fda4af", 16);
    }
  }

  /* Effects */
  function burst(x, y, color, count, speed, life) {
    for (var i = 0; i < count && particles.length < MAX_PARTICLES; i++) {
      var a = Math.random() * Math.PI * 2, v = speed * (0.3 + Math.random() * 0.7), t = (life || 0.5) * (0.6 + Math.random() * 0.6);
      particles.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: t, max: t, c: color, size: 1.4 + Math.random() * 2 });
    }
  }
  function ring(x, y, color, radius, time) { rings.push({ x: x, y: y, c: color, r: radius, age: 0, max: time }); }
  function floatText(x, y, text, color, size) { floats.push({ x: clamp(x, 34, W - 34), y: y, text: text, c: color, size: size || 12, age: 0 }); }
  function addShake(v) { if (!RM) shake = Math.max(shake, v); }

  function addScore(pts, x, y, color, size) {
    score += pts;
    setScore(true);
    floatText(x, y, "+" + pts, color, size);
  }

  /* Combat */
  function fire() {
    bullets.push({ x: ship.x - 7, y: ship.y - 8, vx: 0 });
    bullets.push({ x: ship.x + 7, y: ship.y - 8, vx: 0 });
    if (powerT > 0) {
      bullets.push({ x: ship.x - 10, y: ship.y - 4, vx: -80 });
      bullets.push({ x: ship.x + 10, y: ship.y - 4, vx: 80 });
    }
    ship.recoil = 1;
    ship.muzzle = 1;
  }

  function enemyShot(x, y, angle, speed) {
    shots.push({ x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, dead: false });
  }

  function hitEnemy(en, bx, by) {
    en.hp--;
    en.flash = 1;
    burst(bx, by, "#7dd3fc", en.kind === "boss" ? 2 : 3, 90, 0.25);
    if (en.hp <= 0) killEnemy(en);
    else if (en.kind === "boss" && en.adds > 0 && en.hp / en.maxHp < (en.adds === 2 ? 0.62 : 0.3)) {
      // The boss calls for help as it weakens
      en.adds--;
      for (var i = 0; i < 4; i++) spawn("scout", 70 + (W - 140) * i / 3).phase = clock;
      floatText(W / 2, en.y + 52, "REINFORCEMENTS!", "#fda4af", 12);
    }
  }

  function killEnemy(en) {
    en.dead = true;
    combo++;
    comboT = COMBO_TIME;
    var mult = comboMult();
    var kind = en.kind;
    burst(en.x, en.y, en.c, kind === "boss" ? 70 : kind === "tank" ? 26 : 14, kind === "boss" ? 260 : 150, kind === "boss" ? 1 : 0.55);
    burst(en.x, en.y, "#ffffff", kind === "boss" ? 20 : 5, 110, 0.3);
    ring(en.x, en.y, en.c, kind === "boss" ? 110 : en.r * 2.6, kind === "boss" ? 0.7 : 0.34);
    addScore(en.pts * mult, en.x, en.y - 6, mult > 1 ? "#fde047" : "#ffffff", kind === "scout" ? 12 : 15);
    beep(300 + mult * 70);

    if (kind === "tank") addShake(4);
    if (kind === "boss") {
      addShake(10);
      slowT = 0.45;
      boss = null;
      won = true;
      phase = "finale";
      finaleT = 1.5;
      shots = [];
      enemies.forEach(function(o) {
        if (!o.dead) { o.dead = true; burst(o.x, o.y, o.c, 12, 140); }
      });
      beep(960);
    }
  }

  function comboMult() { return Math.min(5, 1 + Math.floor(combo / 3)); }

  function hurtShip() {
    if (invuln > 0 || phase !== "play") return;
    lives--;
    combo = 0;
    comboT = 0;
    setLives();
    burst(ship.x, ship.y, "#38bdf8", 22, 170, 0.6);
    addShake(7);
    slowT = 0.14;
    if (!RM) hurtFlash = 1;
    beep(170);
    shots = [];
    if (lives <= 0) {
      burst(ship.x, ship.y, "#f97316", 50, 230, 0.9);
      ring(ship.x, ship.y, "#f97316", 80, 0.6);
      endGame(false);
    } else {
      invuln = INVULN_TIME;
      ring(ship.x, ship.y, "#f43f5e", 44, 0.4);
    }
  }

  function endGame(didWin) {
    phase = "over";
    won = didWin;
    overT = 0;
    if (didWin) {
      score += lives * 100;
      setScore(true);
      setWave("CLEARED!");
    } else {
      setWave("GAME OVER");
    }
    if (score > blasterBest) {
      isBest = blasterBest > 0;
      blasterBest = score;
    }
  }

  /* Input */
  function setTarget(x) { ship.target = clamp(x, 18, W - 18); }

  function onPointerMove(e) {
    var rect = canvas.getBoundingClientRect();
    if (!rect.width) return;
    if (e.pointerType === "touch") {
      // Touch drags relative to the finger, so the finger never covers the ship
      if (touchX === null) return;
      setTarget(ship.target + (e.clientX - touchX) * W / rect.width);
      touchX = e.clientX;
    } else {
      setTarget((e.clientX - rect.left) * W / rect.width);
    }
  }
  function onPointerDown(e) {
    if (e.pointerType === "touch") touchX = e.clientX;
    else onPointerMove(e);
  }
  function onPointerUp() { touchX = null; }
  function onKeyDown(e) {
    keys[e.key] = true;
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") e.preventDefault();
  }
  function onKeyUp(e) { keys[e.key] = false; }

  canvas.addEventListener("pointerdown", onPointerDown);
  window.addEventListener("pointermove", onPointerMove);
  window.addEventListener("pointerup", onPointerUp);
  window.addEventListener("pointercancel", onPointerUp);
  window.addEventListener("keydown", onKeyDown);
  window.addEventListener("keyup", onKeyUp);

  gameCleanup = function() {
    window.removeEventListener("pointermove", onPointerMove);
    window.removeEventListener("pointerup", onPointerUp);
    window.removeEventListener("pointercancel", onPointerUp);
    window.removeEventListener("keydown", onKeyDown);
    window.removeEventListener("keyup", onKeyUp);
  };

  canvas.addEventListener("click", function() {
    // The short wait stops a tap from the heat of the moment skipping the result
    if (phase === "over" && overT > 0.7) newGame();
  });

  /* Simulation */
  function updateEnemy(en, h) {
    en.t += h;
    en.flash = Math.max(0, en.flash - h * 7);

    if (en.kind === "boss") {
      en.y += (H * 0.2 - en.y) * ease(1.6, h);
      en.x = W / 2 + Math.sin(en.t * 0.75) * (W / 2 - 62);
      en.fireT -= h;
      if (en.fireT <= 0 && en.t > 2) {
        var enraged = en.hp / en.maxHp < 0.5;
        en.fireT = enraged ? 1.5 : 2;
        var count = enraged ? 6 : 5, speed = H * 0.44;
        for (var i = 0; i < count; i++) enemyShot(en.x, en.y + 22, Math.PI / 2 + (i - (count - 1) / 2) * 0.21, speed);
        ring(en.x, en.y + 22, "#fb7185", 26, 0.25);
        beep(240);
      }
      return;
    }

    en.y += en.fall * H * h;
    if (en.kind === "scout") {
      en.x = en.baseX + Math.sin(en.t * 2.1 + en.phase) * 26;
    } else if (en.kind === "darter") {
      // Curves toward the ship until it gets close, so a late dodge still works
      if (en.y < H * 0.6) en.vx += clamp(ship.x - en.x, -1, 1) * 260 * h;
      en.vx *= 1 - ease(1.2, h);
      en.x = clamp(en.x + en.vx * h, en.r, W - en.r);
    } else if (en.kind === "tank") {
      en.x = en.baseX + Math.sin(en.t * 1.1) * 14;
      en.fireT -= h;
      if (en.fireT <= 0 && en.y > 0 && en.y < H * 0.68) {
        en.fireT = 2.1;
        enemyShot(en.x, en.y + en.r, Math.atan2(ship.y - en.y, ship.x - en.x), H * 0.5);
        beep(260);
      }
    }

    if (en.y > H + en.r + 8) {
      en.dead = true;
      // A bug that slips past only costs the combo, not a life
      if (phase === "play") { combo = 0; comboT = 0; }
    }
  }

  function update(h) {
    clock += h;
    warp = Math.max(0, warp - h * 1.1);
    for (var s = 0; s < stars.length; s++) {
      var st = stars[s];
      st.y += st.speed * (1 + warp * 7) * h;
      if (st.y > H + 6) { st.y = -6; st.x = Math.random() * W; }
    }

    shake = Math.max(0, shake - h * 22);
    shakeX = shake ? (Math.random() - 0.5) * shake : 0;
    shakeY = shake ? (Math.random() - 0.5) * shake : 0;
    hurtFlash = Math.max(0, hurtFlash - h * 3);
    invuln = Math.max(0, invuln - h);
    powerT = Math.max(0, powerT - h);
    ship.recoil = Math.max(0, ship.recoil - h * 12);
    ship.muzzle = Math.max(0, ship.muzzle - h * 18);
    if (comboT > 0) {
      comboT -= h;
      if (comboT <= 0) combo = 0;
    }

    var shipAlive = !(phase === "over" && !won);
    if (shipAlive) {
      if (keys["ArrowLeft"] || keys["a"] || keys["A"]) setTarget(ship.target - 440 * h);
      if (keys["ArrowRight"] || keys["d"] || keys["D"]) setTarget(ship.target + 440 * h);
      var prevX = ship.x;
      ship.x += (ship.target - ship.x) * ease(24, h);
      var lean = h > 0 ? clamp((ship.x - prevX) / h / 520, -1, 1) : 0;
      ship.bank += (lean - ship.bank) * ease(14, h);
    }

    if (phase === "count") {
      countT -= h;
      if (countT <= 0) { phase = "play"; startWave(0); }
    } else if (phase === "play") {
      waveT += h;
      while (events.length && events[0].t <= waveT) events.shift().fn();
      if (!events.length && !enemies.length && wave < 3) {
        if (breakT === 0) {
          score += 50;
          setScore(true);
          floatText(W / 2, H * 0.42, "WAVE CLEAR +50", "#86efac", 15);
          beep(760);
        }
        breakT += h;
        if (breakT >= WAVE_BREAK) startWave(wave + 1);
      }
      fireT -= h;
      if (fireT <= 0) {
        fireT += FIRE_RATE;
        fire();
      }
    } else if (phase === "finale") {
      finaleT -= h;
      if (Math.random() < h * 16) {
        var bx = Math.random() * W, by = Math.random() * H * 0.6;
        burst(bx, by, ["#f97316", "#fde047", "#f43f5e"][Math.floor(Math.random() * 3)], 12, 150, 0.6);
        ring(bx, by, "#fde047", 26, 0.3);
      }
      if (finaleT <= 0) {
        endGame(true);
      }
    } else if (phase === "over") {
      overT += h;
    }

    if (banner) {
      banner.age += h;
      if (banner.age > BANNER_TIME) banner = null;
    }

    for (var b = bullets.length - 1; b >= 0; b--) {
      var bu = bullets[b];
      bu.y -= BULLET_SPEED * h;
      bu.x += bu.vx * h;
      if (bu.y < -12 || bu.x < -12 || bu.x > W + 12) bullets.splice(b, 1);
    }

    for (var e = 0; e < enemies.length; e++) updateEnemy(enemies[e], h);

    for (var q = shots.length - 1; q >= 0; q--) {
      var sh = shots[q];
      sh.x += sh.vx * h;
      sh.y += sh.vy * h;
      if (sh.y > H + 10 || sh.y < -10 || sh.x < -10 || sh.x > W + 10) shots.splice(q, 1);
    }

    for (var c = chips.length - 1; c >= 0; c--) {
      var ch = chips[c];
      ch.t += h;
      ch.y += H * 0.2 * h;
      // Close chips pull toward the ship so near-misses still count
      var cdx = ship.x - ch.x, cdy = ship.y - ch.y, cd = Math.hypot(cdx, cdy);
      if (cd < 70 && shipAlive) {
        var pull = (1 - cd / 70) * 340 * h;
        ch.x += cdx / (cd || 1) * pull;
        ch.y += cdy / (cd || 1) * pull;
      }
      if (cd < 22 && shipAlive) {
        chips.splice(c, 1);
        powerT = POWER_TIME;
        addScore(50, ship.x, ship.y - 22, "#fde047", 15);
        floatText(ship.x, ship.y - 38, "TRIPLE SHOT!", "#fde047", 12);
        burst(ship.x, ship.y, "#facc15", 18, 150, 0.5);
        ring(ship.x, ship.y, "#facc15", 36, 0.35);
        beep(880);
      } else if (ch.y > H + 16) {
        chips.splice(c, 1);
      }
    }

    if (phase === "play") {
      for (var bi = bullets.length - 1; bi >= 0; bi--) {
        var bl = bullets[bi];
        for (var ei = 0; ei < enemies.length; ei++) {
          var en = enemies[ei];
          if (en.dead || en.y < -en.r) continue;
          var rr = en.r + 3;
          if ((bl.x - en.x) * (bl.x - en.x) + (bl.y - en.y) * (bl.y - en.y) < rr * rr) {
            bullets.splice(bi, 1);
            hitEnemy(en, bl.x, bl.y);
            break;
          }
        }
      }
    }

    if (phase === "play") {
      for (var d = 0; d < enemies.length; d++) {
        var foe = enemies[d];
        if (!foe.dead && foe.kind !== "boss" && Math.hypot(foe.x - ship.x, foe.y - ship.y) < foe.r * 0.8 + SHIP_R) {
          if (invuln <= 0) foe.dead = true;
          hurtShip();
          break;
        }
      }
      for (var si = 0; si < shots.length; si++) {
        if (Math.hypot(shots[si].x - ship.x, shots[si].y - ship.y) < 4 + SHIP_R) {
          hurtShip();
          break;
        }
      }
    }

    enemies = enemies.filter(function(o) { return !o.dead; });

    for (var pi = particles.length - 1; pi >= 0; pi--) {
      var pt = particles[pi];
      pt.life -= h;
      if (pt.life <= 0) { particles.splice(pi, 1); continue; }
      var drag = 1 - ease(2.6, h);
      pt.vx *= drag;
      pt.vy *= drag;
      pt.x += pt.vx * h;
      pt.y += pt.vy * h;
    }
    for (var r = rings.length - 1; r >= 0; r--) {
      rings[r].age += h;
      if (rings[r].age > rings[r].max) rings.splice(r, 1);
    }
    for (var f = floats.length - 1; f >= 0; f--) {
      floats[f].age += h;
      floats[f].y -= 26 * h;
      if (floats[f].age > 0.9) floats.splice(f, 1);
    }
  }

  /* Drawing: soft glows come from one small cached image each, which stays smooth on phones */
  function glowImage(color) {
    if (glowCache[color]) return glowCache[color];
    var g = document.createElement("canvas");
    g.width = g.height = 64;
    var gx = g.getContext("2d"), grad = gx.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, color);
    grad.addColorStop(1, color + "00");
    gx.fillStyle = grad;
    gx.fillRect(0, 0, 64, 64);
    glowCache[color] = g;
    return g;
  }
  function drawGlow(x, y, radius, color, alpha) {
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = alpha;
    ctx.drawImage(glowImage(color), x - radius, y - radius, radius * 2, radius * 2);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  function drawBug(en) {
    var r = en.r, flash = en.flash > 0.35, body = flash ? "#ffffff" : en.c;
    var look = clamp((ship.x - en.x) / 120, -1, 1) * r * 0.1;
    drawGlow(en.x, en.y, r * 2.3, en.c, 0.55);
    ctx.save();
    ctx.translate(en.x, en.y);
    ctx.scale(1 + en.flash * 0.1, 1 + en.flash * 0.1);

    // Scuttling legs
    ctx.strokeStyle = en.c;
    ctx.lineWidth = en.kind === "boss" ? 3.4 : 1.7;
    ctx.lineCap = "round";
    ctx.beginPath();
    for (var i = -1; i <= 1; i++) {
      var ly = i * r * 0.45, sway = Math.sin(en.t * 13 + i * 2) * r * 0.2;
      ctx.moveTo(-r * 0.75, ly); ctx.lineTo(-r * 1.32, ly + sway + r * 0.12);
      ctx.moveTo(r * 0.75, ly); ctx.lineTo(r * 1.32, ly - sway + r * 0.12);
    }
    ctx.stroke();

    // Shell and head
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.ellipse(0, 0, r, r * 0.9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.28)";
    ctx.lineWidth = en.kind === "boss" ? 2 : 1.1;
    ctx.beginPath();
    ctx.ellipse(0, -r * 0.05, r * 0.68, r * 0.62, 0, Math.PI, 0);
    ctx.stroke();
    if (en.kind === "tank" || en.kind === "boss") {
      ctx.strokeStyle = "rgba(0,0,0,0.3)";
      ctx.beginPath();
      ctx.moveTo(-r * 0.92, r * 0.24); ctx.lineTo(r * 0.92, r * 0.24);
      ctx.moveTo(-r * 0.72, r * 0.56); ctx.lineTo(r * 0.72, r * 0.56);
      ctx.stroke();
    }

    // Eyes that follow the ship
    var ex = r * 0.38, ey = -r * 0.14, er = r * 0.27;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(-ex, ey, er, 0, Math.PI * 2);
    ctx.arc(ex, ey, er, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#0b1020";
    ctx.beginPath();
    ctx.arc(-ex + look, ey + er * 0.25, er * 0.55, 0, Math.PI * 2);
    ctx.arc(ex + look, ey + er * 0.25, er * 0.55, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Damage pips on tanks
    if (en.kind === "tank" && en.hp < en.maxHp) {
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fillRect(en.x - r, en.y - r - 7, r * 2, 3);
      ctx.fillStyle = "#86efac";
      ctx.fillRect(en.x - r, en.y - r - 7, r * 2 * en.hp / en.maxHp, 3);
    }
  }

  function drawChip(ch) {
    var spin = Math.cos(ch.t * 4.5);
    drawGlow(ch.x, ch.y, 24, "#facc15", 0.7);
    ctx.save();
    ctx.translate(ch.x, ch.y);
    ctx.scale(Math.max(0.18, Math.abs(spin)), 1);
    ctx.fillStyle = "#facc15";
    ctx.beginPath();
    ctx.arc(0, 0, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#fef3c7";
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? 2.4 : 5.6;
      ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawShip() {
    var x = ship.x, y = ship.y + ship.recoil * 1.8;
    if (invuln > 0 && Math.sin(clock * 30) > 0) ctx.globalAlpha = 0.3;
    drawGlow(x, y + 13, 16 + Math.sin(clock * 40) * 2, "#f97316", 0.75);
    if (powerT > 0) drawGlow(x, y, 30, "#facc15", 0.32);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ship.bank * 0.36);

    // Flame stretches when the ship moves
    var flame = 11 + Math.random() * 5 + Math.abs(ship.bank) * 5;
    ctx.fillStyle = "#fb923c";
    ctx.beginPath();
    ctx.moveTo(-5, 10); ctx.lineTo(5, 10); ctx.lineTo(0, 10 + flame);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#fef08a";
    ctx.beginPath();
    ctx.moveTo(-2.5, 10); ctx.lineTo(2.5, 10); ctx.lineTo(0, 10 + flame * 0.55);
    ctx.closePath();
    ctx.fill();

    // Wings then hull; a narrower silhouette as it banks gives a sense of roll
    var wing = 15 - Math.abs(ship.bank) * 3;
    ctx.fillStyle = "#0ea5e9";
    ctx.beginPath();
    ctx.moveTo(0, -6); ctx.lineTo(wing, 11); ctx.lineTo(4, 8); ctx.lineTo(-4, 8); ctx.lineTo(-wing, 11);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#7dd3fc";
    ctx.beginPath();
    ctx.moveTo(0, -15); ctx.lineTo(5.5, 7); ctx.lineTo(0, 11); ctx.lineTo(-5.5, 7);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#0b1020";
    ctx.beginPath();
    ctx.ellipse(0, -2, 2.6, 4.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#e0f2fe";
    ctx.beginPath();
    ctx.arc(-0.7, -3.6, 1, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;

    if (ship.muzzle > 0) {
      drawGlow(x - 7, ship.y - 10, 10, "#7dd3fc", ship.muzzle);
      drawGlow(x + 7, ship.y - 10, 10, "#7dd3fc", ship.muzzle);
    }
  }

  function drawCentered(text, y, font, color, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.font = font;
    ctx.textAlign = "center";
    ctx.fillStyle = color;
    ctx.fillText(text, W / 2, y);
    ctx.globalAlpha = 1;
  }

  function draw() {
    var scale = fit();
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    if (shake) ctx.translate(shakeX, shakeY);

    if (!bg) {
      bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, "#050816");
      bg.addColorStop(0.65, "#0b1022");
      bg.addColorStop(1, "#160f2c");
    }
    ctx.fillStyle = bg;
    ctx.fillRect(-12, -12, W + 24, H + 24);

    for (var s = 0; s < stars.length; s++) {
      var st = stars[s];
      ctx.globalAlpha = st.a;
      ctx.fillStyle = "#dbeafe";
      ctx.fillRect(st.x, st.y, st.size, st.size + warp * st.speed * 0.3);
    }
    ctx.globalAlpha = 1;

    for (var c = 0; c < chips.length; c++) drawChip(chips[c]);
    for (var e = 0; e < enemies.length; e++) drawBug(enemies[e]);

    // Player bullets, drawn in one pass
    ctx.lineCap = "round";
    ctx.strokeStyle = powerT > 0 ? "#fde047" : "#38bdf8";
    ctx.lineWidth = 3.6;
    ctx.beginPath();
    for (var b = 0; b < bullets.length; b++) {
      ctx.moveTo(bullets[b].x, bullets[b].y - 6);
      ctx.lineTo(bullets[b].x - bullets[b].vx * 0.012, bullets[b].y + 5);
    }
    ctx.stroke();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.3;
    ctx.stroke();

    for (var q = 0; q < shots.length; q++) {
      drawGlow(shots[q].x, shots[q].y, 12, "#f43f5e", 0.8);
      ctx.fillStyle = "#fecdd3";
      ctx.beginPath();
      ctx.arc(shots[q].x, shots[q].y, 3.4, 0, Math.PI * 2);
      ctx.fill();
    }

    if (!(phase === "over" && !won)) drawShip();

    for (var r = 0; r < rings.length; r++) {
      var rg = rings[r], grow = rg.age / rg.max;
      ctx.globalAlpha = (1 - grow) * 0.8;
      ctx.strokeStyle = rg.c;
      ctx.lineWidth = 2.5 * (1 - grow) + 0.5;
      ctx.beginPath();
      ctx.arc(rg.x, rg.y, rg.r * (1 - Math.pow(1 - grow, 3)), 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    ctx.globalCompositeOperation = "lighter";
    for (var pi = 0; pi < particles.length; pi++) {
      var pt = particles[pi];
      ctx.globalAlpha = pt.life / pt.max;
      ctx.fillStyle = pt.c;
      ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";

    ctx.textAlign = "center";
    for (var f = 0; f < floats.length; f++) {
      var fl = floats[f];
      ctx.globalAlpha = Math.min(1, (0.9 - fl.age) * 3);
      ctx.font = "800 " + fl.size + "px 'JetBrains Mono', monospace";
      ctx.fillStyle = fl.c;
      ctx.fillText(fl.text, fl.x, fl.y);
    }
    ctx.globalAlpha = 1;

    // Boss health along the top, combo and power-up timers just below it
    var hudY = 16;
    if (boss) {
      var hp = boss.hp / boss.maxHp, bw = W - 80;
      ctx.fillStyle = "rgba(255,255,255,0.14)";
      ctx.fillRect(40, 10, bw, 6);
      ctx.fillStyle = hp < 0.5 ? "#f43f5e" : "#f97316";
      ctx.fillRect(40, 10, bw * hp, 6);
      hudY = 34;
    }
    if (comboMult() > 1) {
      ctx.textAlign = "left";
      ctx.font = "800 15px 'JetBrains Mono', monospace";
      ctx.fillStyle = "#fde047";
      ctx.fillText("x" + comboMult(), 12, hudY + 8);
      ctx.fillStyle = "rgba(253,224,71,0.8)";
      ctx.fillRect(12, hudY + 12, 34 * Math.max(0, comboT) / COMBO_TIME, 2.5);
    }
    if (powerT > 0) {
      ctx.textAlign = "right";
      ctx.font = "700 10px 'JetBrains Mono', monospace";
      ctx.fillStyle = "#fde047";
      ctx.fillText("TRIPLE SHOT", W - 12, hudY + 6);
      ctx.fillStyle = "rgba(253,224,71,0.8)";
      var pw = 68 * powerT / POWER_TIME;
      ctx.fillRect(W - 12 - pw, hudY + 11, pw, 2.5);
    }

    if (phase === "count") {
      drawCentered("GET READY", H / 2 - 40, "700 13px 'JetBrains Mono', monospace", "#cbd5e1");
      drawCentered(Math.max(1, Math.ceil(countT / COUNT_TIME)), H / 2 + 6, "800 44px 'Space Grotesk', sans-serif", "#facc15");
    }
    if (banner) {
      var fade = Math.min(1, banner.age * 5) * Math.min(1, (BANNER_TIME - banner.age) * 4);
      drawCentered(banner.text, H * 0.42, "800 26px 'Space Grotesk', sans-serif", banner.c, fade);
    }

    if (hurtFlash > 0) {
      ctx.fillStyle = "rgba(244, 63, 94, " + (hurtFlash * 0.28) + ")";
      ctx.fillRect(-12, -12, W + 24, H + 24);
    }

    if (phase === "over") {
      var a = Math.min(1, overT / 0.45);
      ctx.fillStyle = "rgba(6, 9, 18, " + (a * 0.84) + ")";
      ctx.fillRect(-12, -12, W + 24, H + 24);
      var cy = H / 2 - 32;
      drawCentered(won ? "🏆 HIVE DESTROYED!" : "SYSTEM OVERLOAD", cy, "800 24px 'Space Grotesk', sans-serif", won ? "#facc15" : "#f43f5e", a);
      drawCentered("SCORE " + score, cy + 34, "800 18px 'JetBrains Mono', monospace", "#ffffff", a);
      if (won) drawCentered("includes +" + (lives * 100) + " for lives left", cy + 54, "500 11px 'JetBrains Mono', monospace", "#94a3b8", a);
      drawCentered(isBest ? "★ NEW BEST!" : "BEST " + blasterBest, cy + (won ? 76 : 58), "700 13px 'JetBrains Mono', monospace", isBest ? "#fde047" : "#94a3b8", a);
      drawCentered("▶ TAP OR CLICK TO PLAY AGAIN", cy + (won ? 104 : 88), "700 12px 'JetBrains Mono', monospace", "#fed7aa", a * (0.65 + 0.35 * Math.sin(clock * 4)));
    }
  }

  function loop(now) {
    var dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
    last = now;
    if (slowT > 0) {
      // A brief slow-down sells the big moments
      slowT -= dt;
      dt *= 0.3;
    }
    var steps = Math.max(1, Math.ceil(dt / MAX_STEP)), h = dt / steps;
    for (var i = 0; i < steps; i++) update(h);
    draw();
    activeGameLoop = requestAnimationFrame(loop);
  }

  newGame();
  activeGameLoop = requestAnimationFrame(loop);
}

      return '<div class="job">' +
             '<h3>'+esc(j.title)+'</h3>' +

             jd(j) +

             j.skills.map(function(s){ return '<span class="tag">'+esc(s)+'</span>'; }).join("") +

/* Event Routing */
function act(t){
  var p = t.closest("[data-p]"), c = t.closest("[data-c]"), q = t.closest("[data-portal]"), l = t.closest("[data-lounge]");
  if (c) collect(+c.dataset.c);
  else if (p) openEmp(+p.dataset.p, p);
  else if (q) openCareers();
  else if (l) openLounge();
}

svg.addEventListener("click", function(e){ if (state === "office") act(e.target); });
svg.addEventListener("keydown", function(e){
  if ((e.key === "Enter" || e.key === " ") && state === "office") {
    e.preventDefault();
    act(e.target);
  }
});

$("start").onclick = function(){
  state = "create";
  show("welcome", false);
  show("create", true);
  if (isReturningUser) {
    step(4);
  } else {
    isReturningUser = false;
    step(1);
  }
};
$("exp").onclick = openCareers;
$("nOv").onclick = function(){
  close();
  if (FLOOR.cols < 3) floor.scrollTo({top: 0, behavior: RM ? "auto" : "smooth"});
};
$("nTeam").onclick = team;
$("nJobs").onclick = openCareers;
$("modal").addEventListener("click", function(e){
  if (e.target === this || !e.target.closest(".card")) close();
});

// Auto-start sound on initial user gesture if enabled by default
function resumeAudioOnGesture() {
  if (snd) {
    updateBGMState();
  }
  ['click', 'keydown', 'touchstart', 'pointerdown'].forEach(function(evt) {
    document.removeEventListener(evt, resumeAudioOnGesture);
  });
}
['click', 'keydown', 'touchstart', 'pointerdown'].forEach(function(evt) {
  document.addEventListener(evt, resumeAudioOnGesture, { passive: true });
});

$("nSnd").onclick = function(){
  snd = !snd;
  this.textContent = "Sound: " + (snd ? "on" : "off");
  setTimeout(syncTopBar, 10);
  this.setAttribute("aria-pressed", snd);
  updateBGMState();
  beep(520);
};

document.addEventListener("keydown", function(e){
  if (e.key === "Escape") {
    if ($("careers").style.display === "flex") $("careers").style.display = "none";
    else if (state === "office") close();
  }
});

addEventListener("resize", function(){
  var cols = floorCols();
  if (cols !== FLOOR.cols) {
    layoutFloor(cols);
    rebuildFloor();
    cancelAnimationFrame(tw);
    vb = ovVB();
    setVB(vb);
  } else if (state === "office" && !sel) {
    vb = ovVB();
    setVB(vb);
  }
  syncTopBar();
});

// Dynamic Collectable Animation System (Firefly Floating & Bouncing)
function getChipAnimType(c) {
  return c.anim || 'firefly';
}

function getChipBounds(c) {
  var maxRadX = 18;
  var maxRadY = 12;

  if (c.zone) {
    var z = CONFIG.zones.find(function(q){ return q.id === c.zone; });
    if (z) {
      var padX = 36, padYTop = 44, padYBottom = 34;
      var spawnX = c.p[0], spawnY = c.p[1];
      var allowLeft = Math.max(6, spawnX - padX);
      var allowRight = Math.max(6, (z.w - padX) - spawnX);
      var allowTop = Math.max(6, spawnY - padYTop);
      var allowBottom = Math.max(6, (z.h - padYBottom) - spawnY);

      return {
        centerX: 0,
        centerY: 0,
        radiusX: Math.min(maxRadX, allowLeft, allowRight),
        radiusY: Math.min(maxRadY, allowTop, allowBottom)
      };
    }
  }

  // Corridor or non-zoned collectables (e.g. Game World Chip in central crossroads)
  return {
    centerX: 0,
    centerY: 0,
    radiusX: 16,
    radiusY: 12
  };
}

function initChipAnimation() {
  var CHIP_STATE = {};
  function tick(now) {
    if (state === "office") {
      // 1. Collectables Dynamic Animation (Firefly Wandering vs Bouncing)
      var chips = svg.querySelectorAll('.chip:not(.got)');
      for (var i = 0; i < chips.length; i++) {
        var chip = chips[i];
        var idx = +chip.dataset.c;
        var c = CONFIG.chips[idx];
        if (!c) continue;
        var body = chip.querySelector('.chip-body');
        var shadow = chip.querySelector('.chip-shadow');
        if (!body) continue;

        // Hover pause-and-resume tracker to prevent position snapping
        if (!CHIP_STATE[idx]) {
          CHIP_STATE[idx] = { hovered: false, hoverStart: 0, timeOffset: 0 };
        }
        var st = CHIP_STATE[idx];
        var isHovered = chip.matches(':hover');

        if (isHovered) {
          if (!st.hovered) {
            st.hovered = true;
            st.hoverStart = now;
          }
          continue; // Pause motion at current position while hovered
        } else {
          if (st.hovered) {
            st.hovered = false;
            st.timeOffset += (now - st.hoverStart);
          }
        }

        var effNow = now - st.timeOffset;
        var animType = getChipAnimType(c);

        if (animType === 'bounce') {
          // Classic 3-hop bounce idle animation (Dev Zone & QA Arena)
          chip.setAttribute('transform', 'translate(0 0)');
          var t = ((effNow * 0.001) + idx * 0.4) % 2.5;
          var h = 0, sx = 1, sy = 1;

          if (t < 0.26) {
            var u = t / 0.26;
            var s = Math.sin(u * Math.PI);
            h = s * 12;
            sx = 1 - 0.10 * s;
            sy = 1 + 0.15 * s;
          } else if (t < 0.58) {
            var u = (t - 0.26) / 0.32;
            var s = Math.sin(u * Math.PI);
            h = s * 18;
            sx = 1 - 0.14 * s;
            sy = 1 + 0.22 * s;
          } else if (t < 0.84) {
            var u = (t - 0.58) / 0.26;
            var s = Math.sin(u * Math.PI);
            h = s * 8;
            sx = 1 - 0.06 * s;
            sy = 1 + 0.10 * s;
          }

          body.setAttribute('transform', 'translate(0, ' + (-h.toFixed(2)) + ') scale(' + sx.toFixed(3) + ' ' + sy.toFixed(3) + ')');
          if (shadow) {
            var rx = 14 * (1 - 0.38 * (h / 18));
            var op = 0.35 * (1 - 0.55 * (h / 18));
            shadow.setAttribute('rx', rx.toFixed(2));
            shadow.setAttribute('opacity', op.toFixed(2));
          }
        } else {
          // Dynamic Firefly Randomly Floating Animation (Gentle Speed & Tight Hover Radius)
          var b = getChipBounds(c);
          var seed = idx * 1.731 + 0.5;
          var sec = effNow * 0.000495; // Sped up by 10% from 0.00045 for optimal organic float

          // Multi-frequency organic wandering (tight radius orbit centered at spawn point)
          var wx = 0.46 * Math.sin(sec * 0.55 + seed * 1.618) +
                   0.26 * Math.cos(sec * 1.15 + seed * 2.718) +
                   0.16 * Math.sin(sec * 2.35 + seed * 3.141);

          var wy = 0.44 * Math.cos(sec * 0.48 + seed * 2.718) +
                   0.28 * Math.sin(sec * 1.05 + seed * 3.141) +
                   0.16 * Math.cos(sec * 2.15 + seed * 1.618);

          // Subtle micro air flutter
          var fx = Math.sin(sec * 3.5 + seed) * 0.75;
          var fy = Math.cos(sec * 4.0 + seed) * 0.85;

          var dx = b.centerX + b.radiusX * wx + fx;
          var dy = b.centerY + b.radiusY * wy + fy;

          // Translate entire chip group so hitbox, shadow, and star move smoothly together
          chip.setAttribute('transform', 'translate(' + dx.toFixed(2) + ' ' + dy.toFixed(2) + ')');

          // Firefly breathing luminescence & flight tilt
          var pulse = 0.94 + 0.10 * Math.sin(sec * 2.2 + seed * 2.0);
          var tilt = (Math.cos(sec * 0.55 + seed * 1.618) * -4 + Math.sin(sec * 3.5 + seed) * 1.5).toFixed(1);

          body.setAttribute('transform', 'scale(' + pulse.toFixed(3) + ') rotate(' + tilt + ')');

          if (shadow) {
            var srx = (14 * (0.88 + 0.16 * pulse)).toFixed(1);
            var sop = (0.35 * pulse).toFixed(2);
            shadow.setAttribute('rx', srx);
            shadow.setAttribute('opacity', sop);
          }
        }
      }

      // 2. Studio Lounge: Interactive Table Tennis & Arcade Animations
      var ttBall = svg.querySelector('#tt-ball');
      var ttShadow = svg.querySelector('#tt-ball-shadow');
      var p1Paddle = svg.querySelector('#tt-paddle-left');
      var p2Paddle = svg.querySelector('#tt-paddle-right');
      var p1Wrap = svg.querySelector('#tt-p1-wrap');
      var p2Wrap = svg.querySelector('#tt-p2-wrap');
      var arcPlayer = svg.querySelector('#arcade-player');
      var arcDot1 = svg.querySelector('#arcade-dot-1');
      var arcDot2 = svg.querySelector('#arcade-dot-2');

      if (ttBall) {
        var tRally = (now * 0.001) % 1.35;
        var bx = 180, by = 158, sy = 161, srx = 2.5, sop = 0.45;
        var p1Swing = 0, p2Swing = 0;

        if (tRally < 0.675) {
          // Half 1: Left player hits across net to right player
          var u = tRally / 0.675;
          bx = 88 + 184 * u;
          if (u < 0.72) {
            var p = u / 0.72;
            by = 158 + (164 - 158) * p - Math.sin(p * Math.PI) * 22;
            srx = 2.8 * (1 - Math.sin(p * Math.PI) * 0.35);
            sop = 0.45 * (1 - Math.sin(p * Math.PI) * 0.4);
          } else {
            var p = (u - 0.72) / 0.28;
            by = 164 + (158 - 164) * p - Math.sin(p * Math.PI) * 11;
            srx = 2.5 * (1 - Math.sin(p * Math.PI) * 0.25);
            sop = 0.45 * (1 - Math.sin(p * Math.PI) * 0.3);
          }
          if (tRally < 0.16) {
            p1Swing = Math.sin((tRally / 0.16) * Math.PI) * 9;
          }
        } else {
          // Half 2: Right player returns ball back to left player
          var u = (tRally - 0.675) / 0.675;
          bx = 272 - 184 * u;
          if (u < 0.72) {
            var p = u / 0.72;
            by = 158 + (164 - 158) * p - Math.sin(p * Math.PI) * 22;
            srx = 2.8 * (1 - Math.sin(p * Math.PI) * 0.35);
            sop = 0.45 * (1 - Math.sin(p * Math.PI) * 0.4);
          } else {
            var p = (u - 0.72) / 0.28;
            by = 164 + (158 - 164) * p - Math.sin(p * Math.PI) * 11;
            srx = 2.5 * (1 - Math.sin(p * Math.PI) * 0.25);
            sop = 0.45 * (1 - Math.sin(p * Math.PI) * 0.3);
          }
          var tRel = tRally - 0.675;
          if (tRel < 0.16) {
            p2Swing = Math.sin((tRel / 0.16) * Math.PI) * 9;
          }
        }

        ttBall.setAttribute('cx', bx.toFixed(2));
        ttBall.setAttribute('cy', by.toFixed(2));
        if (ttShadow) {
          ttShadow.setAttribute('cx', bx.toFixed(2));
          ttShadow.setAttribute('cy', sy);
          ttShadow.setAttribute('rx', srx.toFixed(2));
          ttShadow.setAttribute('opacity', sop.toFixed(2));
        }
        if (p1Paddle) {
          p1Paddle.setAttribute('transform', 'translate(' + (88 + p1Swing) + ' ' + (158 - p1Swing * 0.35) + ') rotate(' + (-p1Swing * 2.2) + ')');
        }
        if (p2Paddle) {
          p2Paddle.setAttribute('transform', 'translate(' + (272 - p2Swing) + ' ' + (158 - p2Swing * 0.35) + ') rotate(' + (p2Swing * 2.2) + ')');
        }
        if (p1Wrap) {
          var p1Sway = Math.sin(now * 0.005) * 1.5;
          p1Wrap.setAttribute('transform', 'translate(' + (44 + p1Swing * 0.3) + ' ' + (104 + p1Sway) + ')');
        }
        if (p2Wrap) {
          var p2Sway = Math.cos(now * 0.005) * 1.5;
          p2Wrap.setAttribute('transform', 'translate(' + (316 - p2Swing * 0.3) + ' ' + (104 + p2Sway) + ')');
        }
        if (arcPlayer) {
          var arcSwayX = Math.sin(now * 0.007) * 1.2;
          var arcSwayY = Math.abs(Math.sin(now * 0.014)) * 0.8;
          arcPlayer.setAttribute('transform', 'translate(' + (48 + arcSwayX) + ' ' + (40 - arcSwayY) + ') scale(0.44)');
        }
        if (arcDot1) {
          arcDot1.setAttribute('cx', (24 + 21 + Math.sin(now * 0.008) * 5).toFixed(1));
          arcDot1.setAttribute('cy', (20 + 39 + Math.cos(now * 0.010) * 4).toFixed(1));
        }
        if (arcDot2) {
          arcDot2.setAttribute('cx', (70 + 21 + Math.cos(now * 0.009) * 5).toFixed(1));
          arcDot2.setAttribute('cy', (20 + 39 + Math.sin(now * 0.011) * 4).toFixed(1));
        }
      }

                        // 3. Careers Portal: Candidates Waiting Lounge Animation
      var c1 = svg.querySelector('#cand-1');
      var c2 = svg.querySelector('#cand-2');
      var c3 = svg.querySelector('#cand-3');
      var c4 = svg.querySelector('#cand-4');
      var c5 = svg.querySelector('#cand-5');

      if (c1) {
        var s1 = Math.sin(now * 0.003) * 0.8;
        c1.setAttribute('transform', 'translate(32 ' + (116 + s1) + ')');
      }
      if (c2) {
        var s2 = Math.cos(now * 0.0035) * 0.8;
        c2.setAttribute('transform', 'translate(104 ' + (94 + s2) + ')');
      }
      if (c3) {
        var s3 = Math.sin(now * 0.004) * 0.8;
        c3.setAttribute('transform', 'translate(140 ' + (94 + s3) + ')');
      }
      if (c4) {
        var s4 = Math.cos(now * 0.004) * 0.7;
        c4.setAttribute('transform', 'translate(202 ' + (94 + s4) + ')');
      }
      if (c5) {
        var s5 = Math.sin(now * 0.0032) * 0.8;
        c5.setAttribute('transform', 'translate(238 ' + (94 + s5) + ')');
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

layoutFloor(floorCols());
hq();
buildGame();
initChipAnimation();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncTopBar);
var loc = location.search + location.hash;
if (loc.indexOf('office') !== -1) enter();
if (loc.indexOf('create2') !== -1) { state = "create"; show("welcome", false); show("create", true); step(2); }
else if (loc.indexOf('create3') !== -1) { state = "create"; show("welcome", false); show("create", true); step(3); }
else if (loc.indexOf('create') !== -1) { state = "create"; show("welcome", false); show("create", true); step(1); }
if (loc.indexOf('careers') !== -1) openCareers();
if (loc.indexOf('emp') !== -1) { enter(); setTimeout(function(){ openEmp(0, svg.querySelector('[data-p="0"]')); }, 50); }
})();
</script>
