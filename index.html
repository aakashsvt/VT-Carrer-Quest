<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Virtualize: Career Quest</title>
<meta name="description" content="Explore the Virtualize Technologies studio, meet the team, collect XP chips and unlock open positions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080b11;
  --bg-subtle: #0e131f;
  --surface: #131a27;
  --surface-elevated: #1a2335;
  --surface-glass: rgba(18, 24, 37, 0.86);
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.16);
  --ink: #f8fafc;
  --ink-secondary: #cbd5e1;
  --mut: #8b9bb4;
  --faint: #475569;
  --a: #f59e0b;
  --b: #3b82f6;
  --c: #10b981;
  --zc: #f59e0b;
  --rose: #f43f5e;
  --violet: #8b5cf6;
  --teal: #14b8a6;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html, body {
  width: 100dvw;
  height: 100dvh;
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.6 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  margin: 0;
  line-height: 1.15;
  letter-spacing: -0.02em;
}
.mono {
  font-family: 'JetBrains Mono', monospace;
}
button {
  font: inherit;
  cursor: pointer;
  color: inherit;
}
svg { display: block; }
.layer {
  position: fixed;
  inset: 0;
  width: 100dvw;
  height: 100dvh;
}

/* Glowing Orange Cyber Button System */
.btn {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 15.5px;
  border: 2px solid #f97316;
  border-radius: 10px;
  padding: 12px 24px;
  background: rgba(22, 14, 8, 0.92);
  color: #ffedd5;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 0 18px rgba(249, 115, 22, 0.5), inset 0 0 10px rgba(249, 115, 22, 0.25);
  cursor: pointer;
}
.btn:hover {
  background: linear-gradient(180deg, #f97316 0%, #ea580c 100%);
  color: #ffffff;
  border-color: #fed7aa;
  transform: translateY(-2px);
  box-shadow: 0 0 28px rgba(249, 115, 22, 0.9);
}
.btn:active {
  transform: translateY(0);
}
.btn.alt {
  background: rgba(26, 16, 10, 0.88);
  border: 2px solid rgba(249, 115, 22, 0.6);
  color: #fed7aa;
  box-shadow: 0 0 14px rgba(249, 115, 22, 0.35);
}
.btn.alt:hover {
  background: linear-gradient(180deg, #ea580c 0%, #c2410c 100%);
  color: #ffffff;
  border-color: #fed7aa;
  box-shadow: 0 0 26px rgba(249, 115, 22, 0.85);
}
.btn.primary, .press {
  background: linear-gradient(180deg, #f97316 0%, #ea580c 100%);
  color: #ffffff;
  font-weight: 800;
  border: 2.5px solid #fed7aa;
  border-radius: 12px;
  padding: 13px 28px;
  font-size: 16px;
  box-shadow: 0 0 28px rgba(249, 115, 22, 0.85), inset 0 2px 0 rgba(255, 255, 255, 0.45);
}
.btn.primary:hover, .press:hover {
  filter: brightness(1.15);
  box-shadow: 0 0 38px rgba(249, 115, 22, 1);
  transform: translateY(-2px);
}

button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid #f97316;
  outline-offset: 3px;
}

/* Overlays */
.ov {
  position: fixed;
  inset: 0;
  width: 100dvw;
  height: 100dvh;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  text-align: center;
  padding: 16px;
  overflow: hidden;
  box-sizing: border-box;
}


/* Welcome Overlay (Clean, Focused, Responsive with dvh/dvw) */
#welcome {
  position: fixed;
  inset: 0;
  width: 100dvw;
  height: 100dvh;
  z-index: 5;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  gap: 0;
  /* Moved both the logo and buttons inward by 10% (10dvh) symmetrically */
  padding: calc(clamp(14px, 2.5dvh, 26px) + 10dvh) clamp(16px, 3dvw, 36px);
  pointer-events: none;
  box-sizing: border-box;
  overflow: hidden;
  background: transparent;
}
#welcome > * {
  pointer-events: auto;
}

/* 1. BIGGER VIRTUALIZE TECHNOLOGIES LOGO / BANNER (Symmetrically spaced from top) */
.top-banner {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background: rgba(9, 14, 24, 0.94);
  backdrop-filter: blur(12px);
  border: 3px solid #f59e0b;
  border-radius: 14px;
  padding: clamp(10px, 1.8dvh, 18px) clamp(30px, 4.5dvw, 64px);
  box-shadow: 0 0 35px rgba(245, 158, 11, 0.6), inset 0 0 16px rgba(245, 158, 11, 0.3);
  margin: 0;
  transition: transform 0.2s ease;
}
.top-banner::before, .top-banner::after {
  content: '';
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 28px;
  background: #f59e0b;
  clip-path: polygon(0 40%, 100% 0, 100% 100%, 0 60%);
  box-shadow: 0 0 10px rgba(245, 158, 11, 0.8);
}
.top-banner::before { left: -20px; }
.top-banner::after { right: -20px; transform: translateY(-50%) scaleX(-1); }
.top-banner span {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 800;
  font-size: clamp(16px, 2.6dvw, 26px);
  letter-spacing: clamp(2.5px, 0.4dvw, 4.5px);
  color: #fbbf24;
  text-shadow: 0 0 14px rgba(251, 191, 36, 0.85), 0 2px 4px rgba(0, 0, 0, 0.8);
  white-space: nowrap;
}

/* 2. HERO BOX */
.hero-box {
  background: rgba(8, 14, 28, 0.90);
  backdrop-filter: blur(20px);
  border: 2px solid #00f0ff;
  border-radius: 16px;
  padding: clamp(12px, 2.2dvh, 24px) clamp(18px, 3.5dvw, 40px);
  width: min(580px, 92dvw);
  max-width: min(580px, 92dvw);
  box-shadow: 0 0 35px rgba(0, 240, 255, 0.45), inset 0 0 18px rgba(0, 240, 255, 0.15);
  position: relative;
  text-align: center;
  margin: 0 auto;
}
.hero-box::before, .hero-box::after {
  content: '';
  position: absolute;
  width: 16px;
  height: 16px;
  border: 2.5px solid #38bdf8;
  pointer-events: none;
}
.hero-box::before {
  top: -2px; left: -2px;
  border-right: none; border-bottom: none;
  border-top-left-radius: 6px;
}
.hero-box::after {
  bottom: -2px; right: -2px;
  border-left: none; border-top: none;
  border-bottom-right-radius: 6px;
}
#welcome h1 {
  font-size: clamp(18px, 3.2dvw, 32px);
  font-weight: 800;
  color: #ffffff;
  margin: 0 auto 6px;
  line-height: 1.25;
  letter-spacing: -0.3px;
  text-wrap: balance;
  overflow-wrap: break-word;
  word-break: normal;
  background: none;
  -webkit-text-fill-color: initial;
}
#welcome p {
  color: #38bdf8;
  font-size: clamp(11.5px, 1.4dvw, 14px);
  line-height: 1.45;
  margin: 0;
  max-width: 52ch;
  text-wrap: balance;
}
#welcome p b {
  color: #38bdf8;
  font-weight: 700;
}

/* 3. BUTTONS (HORIZONTAL ROW ON PHONE, TABLET, AND PC) - GLOWING ORANGE THEME */
.btn-group {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: clamp(14px, 3dvw, 26px);
  width: 100%;
  margin: 0;
}
.btn.press {
  background: linear-gradient(180deg, #f97316 0%, #ea580c 100%);
  color: #ffffff;
  font-weight: 800;
  font-size: clamp(16px, 1.8dvw, 20px);
  border: 2.5px solid #fed7aa;
  border-radius: 12px;
  padding: clamp(14px, 1.8dvh, 18px) clamp(32px, 4.2dvw, 50px);
  box-shadow: 0 0 30px rgba(249, 115, 22, 0.85), inset 0 2px 0 rgba(255, 255, 255, 0.45);
  letter-spacing: 0.5px;
  text-transform: none;
  white-space: nowrap;
}
.btn.press:hover {
  filter: brightness(1.15);
  box-shadow: 0 0 42px rgba(249, 115, 22, 1);
  transform: translateY(-2px);
}
#exp {
  background: rgba(22, 14, 8, 0.92);
  border: 2.5px solid #f97316;
  color: #fed7aa;
  font-weight: 800;
  font-size: clamp(15px, 1.7dvw, 19px);
  border-radius: 12px;
  padding: clamp(13px, 1.8dvh, 18px) clamp(28px, 3.8dvw, 44px);
  box-shadow: 0 0 24px rgba(249, 115, 22, 0.65), inset 0 0 14px rgba(249, 115, 22, 0.3);
  letter-spacing: 0.4px;
  white-space: nowrap;
}
#exp:hover {
  background: linear-gradient(180deg, #f97316 0%, #ea580c 100%);
  color: #ffffff;
  border-color: #fed7aa;
  box-shadow: 0 0 36px rgba(249, 115, 22, 0.95);
  transform: translateY(-2px);
}

/* RESPONSIVE TUNING FOR IPADS AND MOBILES */
@media (max-width: 1024px) {
  /* On iPads and mobiles: place hero box close to buttons below the building */
  .hero-box {
    margin-top: auto !important;
    margin-bottom: clamp(10px, 1.6dvh, 16px) !important;
    transform: none !important;
    width: min(600px, 92dvw);
    max-width: min(600px, 92dvw);
    padding: clamp(10px, 1.8dvh, 18px) clamp(16px, 3dvw, 32px);
  }
  .btn-group {
    margin-top: 0 !important;
  }
}

@media (max-width: 600px) {
  #welcome {
    padding: calc(clamp(14px, 2dvh, 22px) + 10dvh) 12px;
  }
  .top-banner {
    margin: 0;
    padding: 10px 24px;
    border-width: 2.5px;
  }
  .top-banner span {
    font-size: 15px;
    letter-spacing: 2px;
  }
  .hero-box {
    margin: auto auto clamp(10px, 1.5dvh, 14px) auto !important;
    padding: 10px 14px;
    width: 92dvw;
    transform: none !important;
  }
  #welcome h1 {
    font-size: 16.5px;
    line-height: 1.22;
    margin-bottom: 4px;
  }
  #welcome p {
    font-size: 11px;
    line-height: 1.35;
  }
  .btn-group {
    flex-direction: row;
    gap: 12px;
    margin: 0;
  }
  .btn.press {
    padding: 12px 24px;
    font-size: 15px;
    border-radius: 10px;
  }
  #exp {
    padding: 12px 22px;
    font-size: 14.5px;
    border-radius: 10px;
  }
}

@media (min-width: 601px) and (max-width: 1024px) {
  .top-banner {
    margin: 0;
  }
  .hero-box {
    margin: auto auto clamp(12px, 1.8dvh, 16px) auto !important;
    width: min(580px, 86dvw);
    transform: none !important;
  }
  #welcome h1 {
    font-size: clamp(18px, 2.5dvw, 24px);
    margin-bottom: 6px;
  }
  #welcome p {
    font-size: clamp(11.5px, 1.4dvw, 13.5px);
  }
  .btn-group {
    margin: 0;
    gap: 16px;
  }
  .btn.press {
    padding: 14px 34px;
    font-size: 17.5px;
  }
  #exp {
    padding: 14px 30px;
    font-size: 16.5px;
  }
}

@media (min-width: 1025px) {
  .top-banner {
    margin: 0;
  }
  .hero-box {
    margin: 0 auto;
    width: 580px;
  }
  .btn-group {
    margin: 0;
  }
}


/* Character Creation Wizard */
#create {
  background: rgba(8, 11, 17, 0.94);
  backdrop-filter: blur(20px);
  display: none;
  z-index: 6;
}
.step-card {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 16px;
  padding: 32px;
  max-width: min(720px, 94vw);
  width: 100%;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}
#create h2 {
  font-size: clamp(20px, 3vw, 26px);
  margin: 0;
}
input[type=text] {
  font: 600 20px 'Space Grotesk', sans-serif;
  text-align: center;
  background: var(--surface-elevated);
  color: var(--ink);
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  padding: 14px 20px;
  width: min(360px, 90vw);
  transition: all 0.2s;
}
input[type=text]:focus {
  border-color: #38bdf8;
  box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
}

.avs {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 14px;
  width: 100%;
}
.av {
  background: var(--surface-elevated);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 10px;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 8px;
}
.av:hover {
  background: #202b40;
  border-color: rgba(255, 255, 255, 0.2);
  transform: translateY(-2px);
}
.av[aria-pressed=true] {
  border-color: #38bdf8;
  background: #19273c;
  box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.3), 0 8px 24px rgba(0, 0, 0, 0.4);
}
.av svg {
  width: 100%;
  height: 140px;
}
.av b {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 600;
  font-size: 13px;
  color: var(--ink);
}
.av span {
  font-size: 11px;
  color: var(--mut);
  line-height: 1.4;
}

.row {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}

.sw {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  border: 2px solid rgba(255, 255, 255, 0.15);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
}
.sw:hover {
  transform: translateY(-2px) scale(1.08);
  border-color: rgba(255, 255, 255, 0.6);
  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.45);
}
.sw[aria-pressed=true] {
  border-color: #ffffff;
  transform: translateY(-3px) scale(1.12);
  box-shadow: 0 0 16px rgba(255, 255, 255, 0.65), 0 6px 16px rgba(0, 0, 0, 0.5);
}

/* Studio ID Pass Card */
.id {
  width: min(380px, 90vw);
  border-radius: 14px;
  padding: 20px;
  text-align: left;
  display: flex;
  gap: 16px;
  align-items: center;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.2);
  position: relative;
  overflow: hidden;
}
.id::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  width: 120px;
  height: 120px;
  background: radial-gradient(circle at top right, rgba(255, 255, 255, 0.15), transparent 70%);
  pointer-events: none;
}
.id svg {
  width: 90px;
  height: 110px;
  flex: none;
  background: rgba(0, 0, 0, 0.25);
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.1);
}
.id h3 {
  font-size: 19px;
  margin: 2px 0;
}
.id small {
  display: block;
  opacity: 0.9;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
}

/* Top Navigation & Telemetry HUD Dock */
#top-bar {
  position: fixed;
  z-index: 4;
  display: none;
  align-items: center;
  justify-content: space-between;
  pointer-events: none;
  box-sizing: border-box;
}
#top-bar > * {
  pointer-events: auto;
}
#nav {
  display: inline-flex;
  width: max-content;
  flex: 0 0 auto;
  gap: 6px;
  align-items: center;
  margin: 0;
  padding: 0;
  white-space: nowrap;
}
#nav .btn {
  height: 38px;
  box-sizing: border-box;
  padding: 0 13px;
  font-size: 12.5px;
  gap: 6px;
  font-weight: 700;
  background: rgba(22, 14, 8, 0.92);
  backdrop-filter: blur(16px);
  border: 1.5px solid #f97316;
  color: #ffedd5;
  border-radius: 9px;
  box-shadow: 0 0 16px rgba(249, 115, 22, 0.45);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
#nav .btn:hover {
  background: linear-gradient(180deg, #f97316 0%, #ea580c 100%);
  color: #ffffff;
  border-color: #fed7aa;
  box-shadow: 0 0 24px rgba(249, 115, 22, 0.85);
}

#hud {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  margin: 0;
  padding: 0;
}
#hud .bar {
  height: 38px;
  box-sizing: border-box;
  background: rgba(9, 14, 24, 0.94);
  backdrop-filter: blur(20px);
  border: 1.5px solid #00f0ff;
  border-radius: 9px;
  padding: 4px 14px 5px;
  font-family: 'Space Grotesk', sans-serif;
  box-shadow: 0 0 20px rgba(0, 240, 255, 0.4), inset 0 0 10px rgba(0, 240, 255, 0.12);
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 3px;
}
.hud-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
#mt {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 800;
  font-size: 12px;
  color: #ffffff;
  letter-spacing: 0.05em;
  text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
  white-space: nowrap;
}
.track {
  height: 5px;
  background: rgba(255, 255, 255, 0.12);
  border-radius: 4px;
  overflow: hidden;
  position: relative;
}
#xpb {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #f59e0b 0%, #fbbf24 100%);
  border-radius: 4px;
  box-shadow: 0 0 12px rgba(251, 191, 36, 0.85);
  transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}
#xpt {
  color: #38bdf8;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 11px;
  text-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
  white-space: nowrap;
}

/* Modals & Dialogs */
#modal {
  position: fixed;
  inset: 0;
  z-index: 6;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(8, 11, 17, 0.78);
  backdrop-filter: blur(12px);
  cursor: pointer;
}
.card {
  cursor: default;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 18px;
  padding: 28px;
  width: min(540px, 100%);
  max-height: 85vh;
  overflow: auto;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
  animation: cardIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  text-align: left;
}
@keyframes cardIn {
  from { transform: translateY(20px) scale(0.97); opacity: 0; }
  to { transform: translateY(0) scale(1); opacity: 1; }
}
.card h2 {
  font-size: 24px;
  margin-bottom: 8px;
  color: var(--ink);
}
.card p {
  color: var(--mut);
  margin: 10px 0;
}
.fact {
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-left: 3px solid #f59e0b;
  border-radius: 10px;
  padding: 16px;
  font-size: 14px;
  color: var(--ink-secondary);
  line-height: 1.6;
}

/* Meet the Team Spotlight Card */
.mp {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
  padding: 0;
  position: relative;
  overflow: hidden;
  max-width: 440px;
}
.mp .pt {
  height: 240px;
  background: radial-gradient(circle at 50% 30%, rgba(56, 189, 248, 0.15), transparent 70%), #0d131f;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  border-bottom: 1px solid var(--border);
  position: relative;
}
.mp .pt svg {
  height: 95%;
}
.mp .pi {
  padding: 24px;
}
.mp small {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.1em;
  color: #38bdf8;
  text-transform: uppercase;
}
.mp h2 {
  font-size: 24px;
  margin: 4px 0 2px;
}
.mp .dp {
  color: var(--zc);
  font-size: 13px;
  font-weight: 600;
  font-family: 'JetBrains Mono', monospace;
}
.mp .tg {
  display: inline-block;
  margin: 10px 0;
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 6px;
  padding: 3px 10px;
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  background: rgba(255, 255, 255, 0.05);
  color: var(--ink-secondary);
}
.mp h4 {
  margin: 16px 0 4px;
  font-size: 14px;
  font-family: 'Space Grotesk', sans-serif;
  color: #cbd5e1;
}
.mp p {
  font-size: 14px;
  line-height: 1.6;
}
.mp .x {
  position: absolute;
  right: 14px;
  top: 14px;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: 1px solid var(--border-strong);
  background: rgba(15, 21, 35, 0.8);
  color: var(--ink);
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.mp .x:hover {
  background: rgba(255, 255, 255, 0.15);
}
.mp .bk {
  width: 100%;
  margin-top: 20px;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 15px;
  border: 2px solid #f97316;
  border-radius: 10px;
  padding: 12px 24px;
  background: rgba(22, 14, 8, 0.94);
  color: #ffedd5;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  box-shadow: 0 0 18px rgba(249, 115, 22, 0.5), inset 0 0 10px rgba(249, 115, 22, 0.25);
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.mp .bk:hover {
  background: linear-gradient(180deg, #f97316 0%, #ea580c 100%);
  color: #ffffff;
  border-color: #fed7aa;
  transform: translateY(-2px);
  box-shadow: 0 0 28px rgba(249, 115, 22, 0.9);
}
.mp .bk:active {
  transform: translateY(0);
}

@media (min-width: 860px) {
  .mp {
    position: fixed;
    right: 24px;
    top: 76px;
    bottom: 68px;
    margin: 0;
    width: 420px;
    max-height: none;
    display: flex;
    flex-direction: column;
  }
  .mp .pi {
    overflow-y: auto;
    flex: 1;
  }
}

/* Careers Overlay & Job Postings - Fully Scrollable */
#careers {
  position: fixed;
  inset: 0;
  width: 100dvw;
  height: 100dvh;
  background: var(--bg);
  z-index: 7;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: clamp(24px, 4dvh, 48px) clamp(16px, 3dvw, 32px);
  text-align: left;
  overflow-y: auto !important;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  box-sizing: border-box;
}
#careers::-webkit-scrollbar {
  width: 8px;
}
#careers::-webkit-scrollbar-track {
  background: rgba(10, 14, 24, 0.8);
}
#careers::-webkit-scrollbar-thumb {
  background: #f97316;
  border-radius: 4px;
  box-shadow: 0 0 10px rgba(249, 115, 22, 0.7);
}
#careers::-webkit-scrollbar-thumb:hover {
  background: #ea580c;
}
.careers-container {
  width: min(960px, 100%);
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 24px;
  padding-bottom: clamp(60px, 10dvh, 100px);
}
.careers-header {
  border-bottom: 1px solid var(--border);
  padding-bottom: 20px;
}
.careers-header h2 {
  font-size: clamp(28px, 3.6vw, 42px);
  margin-bottom: 8px;
}
.careers-header p {
  color: var(--mut);
  margin: 0;
  font-size: 15px;
}
.jobs {
  display: grid;
  grid-template-columns: 1fr;
  gap: 18px;
}
.job {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 14px;
  padding: 24px;
  transition: all 0.2s;
}
.job:hover {
  border-color: rgba(255, 255, 255, 0.25);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
}
.job h3 {
  font-size: 20px;
  margin-bottom: 6px;
  color: var(--ink);
}
.job p {
  margin: 8px 0;
  color: var(--mut);
  font-size: 14px;
}
.job-meta-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 8px 0 14px;
}
.tag {
  display: inline-flex;
  align-items: center;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 3px 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--ink-secondary);
}
.tag.dept {
  color: #38bdf8;
  border-color: rgba(56, 189, 248, 0.25);
  background: rgba(56, 189, 248, 0.08);
}
.jd {
  margin: 14px 0;
  border-top: 1px solid var(--border);
  padding-top: 12px;
}
.jd summary {
  cursor: pointer;
  color: #38bdf8;
  font-weight: 600;
  font-size: 13px;
  font-family: 'Space Grotesk', sans-serif;
  user-select: none;
}
.jd summary:hover {
  text-decoration: underline;
}
.jd ul {
  padding-left: 20px;
  margin: 8px 0;
  font-size: 14px;
  color: var(--ink-secondary);
}
.jd li {
  margin: 5px 0;
}
.jd h4 {
  margin: 14px 0 4px;
  color: #cbd5e1;
  font-size: 14px;
}

/* Toast Notifications */
#toast {
  position: fixed;
  left: 50%;
  bottom: 84px;
  transform: translateX(-50%);
  background: var(--surface-elevated);
  border: 1px solid var(--border-strong);
  color: var(--ink);
  padding: 10px 20px;
  border-radius: 8px;
  z-index: 9;
  display: none;
  max-width: 90vw;
  font-weight: 600;
  font-size: 13px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  font-family: 'Space Grotesk', sans-serif;
}

/* Interactive SVG Elements */
.hit {
  cursor: pointer;
  transition: opacity 0.2s;
}
.hit:hover {
  filter: brightness(1.15);
}
.hit.sel {
  filter: drop-shadow(0 0 4px rgba(245, 158, 11, 0.6));
}
.chip {
  cursor: pointer;
  outline: none;
}
.chip-shadow {
  transition: opacity 0.15s;
}
.chip-body {
  transition: filter 0.2s;
}
.chip:hover .chip-body {
  filter: brightness(1.3) drop-shadow(0 0 6px #ffffff) drop-shadow(0 0 14px #ffffff) !important;
}
.chip.got {
  pointer-events: none;
  animation: chipGone 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
.chip.got .chip-body,
.chip.got .chip-shadow {
  display: none;
}
@keyframes chipGone {
  to { transform: translateY(-30px) scale(1.4); opacity: 0; }
}
</style>

function mon(x, y, w, k) {

  if (k === 'code') {
    g += R(x + 2, y + 2, 6, h - 4, '#0f172a');

    var colors = ['#38bdf8', '#c084fc', '#34d399', '#f59e0b', '#f43f5e', '#e2e8f0'];

function shelf(x, y, w, rows) {
  var g = R(x, y, w, rows * 36 + 8, '#131926', 4, ' stroke="#243046" stroke-width="1.2"');
  for (var r = 0; r < rows; r++) {
    g += R(x + 4, y + 4 + r * 36 + 32, w - 8, 3.5, '#4a3828', 1);
    for (var i = 0, bx = x + 8; bx < x + w - 16; i++) {
      var bw = 6 + (i * 7) % 8, bh = 20 + (i * 5) % 11;
      var bc = ['#1d4ed8', '#047857', '#b45309', '#6d28d9', '#be123c', '#334155'][(i + r * 2) % 6];
      g += R(bx, y + 4 + r * 36 + 32 - bh, bw, bh, bc, 1);
      bx += bw + 2.5;
    }
  }
  return g;
}

function sofa(x, y, w, c) {
  var base = c || '#7c2d12';
  var g = '';
  g += R(x + 4, y + 38, w - 8, 8, 'rgba(0,0,0,0.35)', 4);
  g += St('M'+(x+8)+' '+(y+36)+'L'+(x+5)+' '+(y+44), '#1c1917', 2.5);
  g += St('M'+(x+w-8)+' '+(y+36)+'L'+(x+w-5)+' '+(y+44), '#1c1917', 2.5);
  g += R(x + 8, y + 2, w - 16, 26, mix(base, -0.22), 8);
  g += R(x + 10, y + 4, w - 20, 22, base, 6);
  for (var i = 1; i <= 3; i++) {
    var sx = x + 10 + i * ((w - 20) / 4);
    g += St('M'+sx+' '+(y+6)+'L'+sx+' '+(y+24), mix(base, -0.35), 1.2);
  }
  g += R(x + 2, y + 16, w - 4, 22, mix(base, -0.1), 6);
  g += R(x + 12, y + 18, (w - 28) / 2, 18, mix(base, 0.15), 4);
  g += R(x + 16 + (w - 28) / 2, y + 18, (w - 28) / 2, 18, mix(base, 0.15), 4);
  g += R(x, y + 10, 13, 28, mix(base, -0.15), 5);
  g += R(x + 1.5, y + 11, 10, 12, mix(base, 0.2), 3);
  g += R(x + w - 13, y + 10, 13, 28, mix(base, -0.15), 5);
  g += R(x + w - 11.5, y + 11, 10, 12, mix(base, 0.2), 3);
  return g;
}

function arcade(x, y, c, dotId) {
  var ac = c || '#10b981';
  var g = '';
  g += R(x, y, 42, 80, '#0c101c', 6, ' stroke="#1e293b" stroke-width="1.5"');
  g += R(x + 4, y + 6, 34, 14, '#182236', 3);
  g += Tx(x + 21, y + 16, 'ARCADE', 7, ac);
  g += R(x + 4, y + 24, 34, 30, '#090d16', 2, ' stroke="#1e293b" stroke-width="1"');
  g += R(x + 6, y + 26, 30, 26, '#181230', 2);
  g += Ci(x + 21, y + 39, 6, ac, ' opacity="0.8" style="filter:drop-shadow(0 0 6px '+ac+')"' + (dotId ? ' id="'+dotId+'"' : ''));
  g += R(x + 4, y + 58, 34, 8, '#1e293b', 2);
  g += Ci(x + 12, y + 62, 2.5, '#ef4444');
  g += Ci(x + 22, y + 62, 2.5, '#f59e0b');
  g += Ci(x + 30, y + 62, 2.5, '#38bdf8');
  g += R(x + 15, y + 70, 12, 6, '#090d16', 1, ' stroke="#334155" stroke-width="0.8"');
  return g;
}

function skyW(x, y, w, h) {
  var g = R(x, y, w, h, 'url(#sky)', 4);
  for (var i = 0; i < 9; i++) {
    var bw = 12 + (i * 7) % 14, bh = 14 + (i * 13) % (h - 20);
    g += R(x + 4 + i * (w / 9.2), y + h - bh - 2, bw, bh, '#0d1326');
  }
  g += R(x, y, w, h, 'none', 4, ' stroke="#334155" stroke-width="2.5"');
  g += R(x + w / 2 - 1.5, y, 3, h, '#334155');
  return g;
}

function tagpill(x, y, t, c) {
  var pw = Math.max(90, t.length * 7.5 + 22);
  return '<g style="filter:drop-shadow(0 0 7px '+c+')">'+
         '<rect x="'+(x - pw / 2)+'" y="'+y+'" width="'+pw+'" height="26" rx="7" fill="#070b14" stroke="'+c+'" stroke-width="2"/>'+
         Tx(x, y + 17.5, esc(t), 12, "#ffffff", 800)+'</g>';
}

function buildGame() {
  var d = '<defs>'+
    '<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0" stop-color="#090d16"/>'+
      '<stop offset="0.6" stop-color="#1e1b4b"/>'+
      '<stop offset="1" stop-color="#701a75"/>'+
    '</linearGradient>'+
    '<radialGradient id="portal-glow">'+
      '<stop offset="0" stop-color="#fef3c7" stop-opacity="0.8"/>'+
      '<stop offset="0.5" stop-color="#f59e0b" stop-opacity="0.4"/>'+
      '<stop offset="1" stop-color="#141926" stop-opacity="0.9"/>'+
    '</radialGradient>'+
    '<radialGradient id="portal-sunburst" cx="50%" cy="50%" r="50%">'+
      '<stop offset="0%" stop-color="#fef08a" stop-opacity="0.95"/>'+
      '<stop offset="40%" stop-color="#f59e0b" stop-opacity="0.75"/>'+
      '<stop offset="70%" stop-color="#f59e0b" stop-opacity="0.3"/>'+
      '<stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>'+
    '</radialGradient>'+
    '<filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">'+
      '<feGaussianBlur stdDeviation="5" result="blur"/>'+
      '<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>'+
    '</filter>'+
    '<linearGradient id="fl" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0" stop-color="#151b29"/>'+
      '<stop offset="1" stop-color="#0d121c"/>'+
    '</linearGradient>';

  CONFIG.zones.forEach(function(z) {
    d += '<linearGradient id="w'+z.id+'" x1="0" y1="0" x2="0" y2="1">'+
           '<stop offset="0" stop-color="'+mix(z.wall, 0.15)+'"/><stop offset="1" stop-color="'+mix(z.wall, -0.2)+'"/></linearGradient>'+
         '<linearGradient id="f'+z.id+'" x1="0" y1="0" x2="0" y2="1">'+
           '<stop offset="0" stop-color="'+mix(z.floor, 0.15)+'"/><stop offset="1" stop-color="'+mix(z.floor, -0.25)+'"/></linearGradient>';
  });
  d += '</defs>';

  var s = d + R(0, 0, 1200, 900, "rgba(4,7,16,0.35)") +
          R(0, 293, 1200, 24, "url(#fl)") +
          R(0, 583, 1200, 24, "url(#fl)") +
          R(393, 0, 24, 900, "url(#fl)") +
          R(783, 0, 24, 900, "url(#fl)");

  [[0, 304, 1200, 2], [0, 594, 1200, 2], [404, 0, 2, 900], [794, 0, 2, 900]].forEach(function(l) {
    s += R(l[0], l[1], l[2], l[3], "#334155", 0, ' opacity="0.4"');
  });

  CONFIG.zones.forEach(function(z) { s += room(z); });
  CONFIG.chips.forEach(function(c) {
    var z = c.zone ? CONFIG.zones.filter(function(q){ return q.id === c.zone; })[0] : {x: 0, y: 0};
    s += chipG(c, z.x + c.p[0], z.y + c.p[1]);
  });

  $("game").innerHTML = s;
}

/* Camera System */
var svg = $("game"), vb = [0, 0, 1200, 900], tw = 0;
function setVB(a){ svg.setAttribute("viewBox", a.join(" ")); }
function goVB(to){
  var from = vb.slice(), t0 = performance.now();
  cancelAnimationFrame(tw);
  (function st(t){
    var p = Math.min(1, (t - t0) / (RM ? 1 : 550)), e = 1 - Math.pow(1 - p, 3);
    vb = from.map(function(v, i){ return v + (to[i] - v) * e; });
    setVB(vb);
    if (p < 1) tw = requestAnimationFrame(st);
  })(t0);
}
function ovVB(){
  var a = innerWidth / innerHeight, baseH = 1040, baseW = 1240;
  var w = baseW, h = baseH;
  if (a > w / h) w = h * a; else h = w / a;
  return [600 - w / 2, 450 - h / 2 - 40, w, h];
}
function fitZ(z, sh){
  var a = innerWidth / innerHeight, w = z.w * 1.55, h = w / a;
  if (h < z.h * 1.5) { h = z.h * 1.5; w = h * a; }
  var cx = z.x + z.w / 2, cy = z.y + z.h / 2;
  if (sh) {
    if (innerWidth >= 860) cx += w * 0.2; else cy += h * 0.17;
  }
  return [cx - w / 2, cy - h / 2, w, h];
}

function syncTopBar(){
  var tb = $("top-bar");
  if (!tb || tb.style.display === "none") return;
  var nav = $("nav"), hud = $("hud"), hudBar = document.querySelector("#hud .bar");
  if (!nav || !hud || !hudBar) return;

  var vbO = ovVB();
  var scale = innerWidth / vbO[2];
  var roomLeft = (30 - vbO[0]) * scale;
  var roomRight = (1170 - vbO[0]) * scale;
  var headerPillTop = (14 - vbO[1]) * scale;
  var totalWidth = roomRight - roomLeft;

  // Ensure nav takes natural content width
  nav.style.width = "max-content";
  var navW = nav.offsetWidth;
  if (navW > 0) {
    hudBar.style.width = navW + "px";
  }

  var barH = Math.max(nav.offsetHeight, hudBar.offsetHeight, 38);
  var topPos = Math.max(12, Math.round((headerPillTop - barH) / 2));

  tb.style.left = Math.round(roomLeft) + "px";
  tb.style.width = Math.round(totalWidth) + "px";
  tb.style.top = topPos + "px";
}

// Dynamic Collectable Animation System (Firefly Floating & Bouncing)
function getChipAnimType(c) {
  if (c.anim) return c.anim;
  if (c.zone === 'dev' || c.zone === 'qa') return 'bounce';
  return 'firefly';
}

function getChipBounds(c) {
  var padX = 42;
  var padYTop = 46;
  var padYBottom = 38;

  if (c.zone) {
    var z = CONFIG.zones.find(function(q){ return q.id === c.zone; });
    if (z) {
      var minX = padX;
      var maxX = z.w - padX;
      var minY = padYTop;
      var maxY = z.h - padYBottom;

      var spawnX = c.p[0];
      var spawnY = c.p[1];

      var minDx = minX - spawnX;
      var maxDx = maxX - spawnX;
      var minDy = minY - spawnY;
      var maxDy = maxY - spawnY;

      return {
        centerX: (minDx + maxDx) * 0.5,
        centerY: (minDy + maxDy) * 0.5,
        radiusX: Math.max(18, (maxDx - minDx) * 0.5),
        radiusY: Math.max(14, (maxDy - minDy) * 0.5)
      };
    }
  }

  // Corridor or non-zoned collectables (e.g. Game World Chip in central crossroads)
  return {
    centerX: 0,
    centerY: 0,
    radiusX: 36,
    radiusY: 30
  };
}

function initChipAnimation() {
  var CHIP_STATE = {};
  function tick(now) {
    if (state === "office") {
      // 1. Collectables Dynamic Animation (Firefly Wandering vs Bouncing)
      var chips = svg.querySelectorAll('.chip:not(.got)');
      for (var i = 0; i < chips.length; i++) {
        var chip = chips[i];
        var idx = +chip.dataset.c;
        var c = CONFIG.chips[idx];
        if (!c) continue;
        var body = chip.querySelector('.chip-body');
        var shadow = chip.querySelector('.chip-shadow');
        if (!body) continue;

        // Hover pause-and-resume tracker to prevent position snapping
        if (!CHIP_STATE[idx]) {
          CHIP_STATE[idx] = { hovered: false, hoverStart: 0, timeOffset: 0 };
        }
        var st = CHIP_STATE[idx];
        var isHovered = chip.matches(':hover');

        if (isHovered) {
          if (!st.hovered) {
            st.hovered = true;
            st.hoverStart = now;
          }
          continue; // Pause motion at current position while hovered
        } else {
          if (st.hovered) {
            st.hovered = false;
            st.timeOffset += (now - st.hoverStart);
          }
        }

        var effNow = now - st.timeOffset;
        var animType = getChipAnimType(c);

        if (animType === 'bounce') {
          // Classic 3-hop bounce idle animation (Dev Zone & QA Arena)
          chip.setAttribute('transform', 'translate(0 0)');
          var t = ((effNow * 0.001) + idx * 0.4) % 2.5;
          var h = 0, sx = 1, sy = 1;

          if (t < 0.26) {
            var u = t / 0.26;
            var s = Math.sin(u * Math.PI);
            h = s * 12;
            sx = 1 - 0.10 * s;
            sy = 1 + 0.15 * s;
          } else if (t < 0.58) {
            var u = (t - 0.26) / 0.32;
            var s = Math.sin(u * Math.PI);
            h = s * 18;
            sx = 1 - 0.14 * s;
            sy = 1 + 0.22 * s;
          } else if (t < 0.84) {
            var u = (t - 0.58) / 0.26;
            var s = Math.sin(u * Math.PI);
            h = s * 8;
            sx = 1 - 0.06 * s;
            sy = 1 + 0.10 * s;
          }

          body.setAttribute('transform', 'translate(0, ' + (-h.toFixed(2)) + ') scale(' + sx.toFixed(3) + ' ' + sy.toFixed(3) + ')');
          if (shadow) {
            var rx = 14 * (1 - 0.38 * (h / 18));
            var op = 0.35 * (1 - 0.55 * (h / 18));
            shadow.setAttribute('rx', rx.toFixed(2));
            shadow.setAttribute('opacity', op.toFixed(2));
          }
        } else {
          // Dynamic Firefly Randomly Floating Animation (Strictly Contained within Room Bounds)
          var b = getChipBounds(c);
          var seed = idx * 1.731 + 0.5;
          var sec = effNow * 0.001;

          // Multi-frequency organic wandering (coefficients sum to <= 0.90 for guaranteed containment)
          var wx = 0.46 * Math.sin(sec * 0.55 + seed * 1.618) +
                   0.28 * Math.cos(sec * 1.15 + seed * 2.718) +
                   0.16 * Math.sin(sec * 2.35 + seed * 3.141);

          var wy = 0.44 * Math.cos(sec * 0.48 + seed * 2.718) +
                   0.30 * Math.sin(sec * 1.05 + seed * 3.141) +
                   0.16 * Math.cos(sec * 2.15 + seed * 1.618);

          // Micro air flutter
          var fx = Math.sin(sec * 5.2 + seed) * 2.0;
          var fy = Math.cos(sec * 6.1 + seed) * 2.2;

          var dx = b.centerX + b.radiusX * wx + fx;
          var dy = b.centerY + b.radiusY * wy + fy;

          // Translate entire chip group so hitbox, shadow, and star move smoothly together
          chip.setAttribute('transform', 'translate(' + dx.toFixed(2) + ' ' + dy.toFixed(2) + ')');

          // Firefly breathing luminescence & flight tilt
          var pulse = 0.92 + 0.15 * Math.sin(sec * 3.2 + seed * 2.0);
          var tilt = (Math.cos(sec * 0.55 + seed * 1.618) * -7 + Math.sin(sec * 5.2 + seed) * 2.5).toFixed(1);

          body.setAttribute('transform', 'scale(' + pulse.toFixed(3) + ') rotate(' + tilt + ')');

          if (shadow) {
            var srx = (14 * (0.85 + 0.20 * pulse)).toFixed(1);
            var sop = (0.35 * pulse).toFixed(2);
            shadow.setAttribute('rx', srx);
            shadow.setAttribute('opacity', sop);
          }
        }
      }

      // 2. Studio Lounge: Interactive Table Tennis & Arcade Animations
      var ttBall = svg.querySelector('#tt-ball');
      var ttShadow = svg.querySelector('#tt-ball-shadow');
      var p1Paddle = svg.querySelector('#tt-paddle-left');
      var p2Paddle = svg.querySelector('#tt-paddle-right');
      var p1Wrap = svg.querySelector('#tt-p1-wrap');
      var p2Wrap = svg.querySelector('#tt-p2-wrap');
      var arcPlayer = svg.querySelector('#arcade-player');
      var arcDot1 = svg.querySelector('#arcade-dot-1');
      var arcDot2 = svg.querySelector('#arcade-dot-2');

      if (ttBall) {
        var tRally = (now * 0.001) % 1.35;
        var bx = 180, by = 158, sy = 161, srx = 2.5, sop = 0.45;
        var p1Swing = 0, p2Swing = 0;

        if (tRally < 0.675) {
          // Half 1: Left player hits across net to right player
          var u = tRally / 0.675;
          bx = 88 + 184 * u;
          if (u < 0.72) {
            var p = u / 0.72;
            by = 158 + (164 - 158) * p - Math.sin(p * Math.PI) * 22;
            srx = 2.8 * (1 - Math.sin(p * Math.PI) * 0.35);
            sop = 0.45 * (1 - Math.sin(p * Math.PI) * 0.4);
          } else {
            var p = (u - 0.72) / 0.28;
            by = 164 + (158 - 164) * p - Math.sin(p * Math.PI) * 11;
            srx = 2.5 * (1 - Math.sin(p * Math.PI) * 0.25);
            sop = 0.45 * (1 - Math.sin(p * Math.PI) * 0.3);
          }
          if (tRally < 0.16) {
            p1Swing = Math.sin((tRally / 0.16) * Math.PI) * 9;
          }
        } else {
          // Half 2: Right player returns ball back to left player
          var u = (tRally - 0.675) / 0.675;
          bx = 272 - 184 * u;
          if (u < 0.72) {
            var p = u / 0.72;
            by = 158 + (164 - 158) * p - Math.sin(p * Math.PI) * 22;
            srx = 2.8 * (1 - Math.sin(p * Math.PI) * 0.35);
            sop = 0.45 * (1 - Math.sin(p * Math.PI) * 0.4);
          } else {
            var p = (u - 0.72) / 0.28;
            by = 164 + (158 - 164) * p - Math.sin(p * Math.PI) * 11;
            srx = 2.5 * (1 - Math.sin(p * Math.PI) * 0.25);
            sop = 0.45 * (1 - Math.sin(p * Math.PI) * 0.3);
          }
          var tRel = tRally - 0.675;
          if (tRel < 0.16) {
            p2Swing = Math.sin((tRel / 0.16) * Math.PI) * 9;
          }
        }

        ttBall.setAttribute('cx', bx.toFixed(2));
        ttBall.setAttribute('cy', by.toFixed(2));
        if (ttShadow) {
          ttShadow.setAttribute('cx', bx.toFixed(2));
          ttShadow.setAttribute('cy', sy);
          ttShadow.setAttribute('rx', srx.toFixed(2));
          ttShadow.setAttribute('opacity', sop.toFixed(2));
        }
        if (p1Paddle) {
          p1Paddle.setAttribute('transform', 'translate(' + (88 + p1Swing) + ' ' + (158 - p1Swing * 0.35) + ') rotate(' + (-p1Swing * 2.2) + ')');
        }
        if (p2Paddle) {
          p2Paddle.setAttribute('transform', 'translate(' + (272 - p2Swing) + ' ' + (158 - p2Swing * 0.35) + ') rotate(' + (p2Swing * 2.2) + ')');
        }
        if (p1Wrap) {
          var p1Sway = Math.sin(now * 0.005) * 1.5;
          p1Wrap.setAttribute('transform', 'translate(' + (44 + p1Swing * 0.3) + ' ' + (104 + p1Sway) + ')');
        }
        if (p2Wrap) {
          var p2Sway = Math.cos(now * 0.005) * 1.5;
          p2Wrap.setAttribute('transform', 'translate(' + (316 - p2Swing * 0.3) + ' ' + (104 + p2Sway) + ')');
        }
        if (arcPlayer) {
          var arcSwayX = Math.sin(now * 0.007) * 1.2;
          var arcSwayY = Math.abs(Math.sin(now * 0.014)) * 0.8;
          arcPlayer.setAttribute('transform', 'translate(' + (48 + arcSwayX) + ' ' + (40 - arcSwayY) + ') scale(0.44)');
        }
        if (arcDot1) {
          arcDot1.setAttribute('cx', (24 + 21 + Math.sin(now * 0.008) * 5).toFixed(1));
          arcDot1.setAttribute('cy', (20 + 39 + Math.cos(now * 0.010) * 4).toFixed(1));
        }
        if (arcDot2) {
          arcDot2.setAttribute('cx', (70 + 21 + Math.cos(now * 0.009) * 5).toFixed(1));
          arcDot2.setAttribute('cy', (20 + 39 + Math.sin(now * 0.011) * 4).toFixed(1));
        }
      }

                        // 3. Careers Portal: Candidates Waiting Lounge Animation
      var c1 = svg.querySelector('#cand-1');
      var c2 = svg.querySelector('#cand-2');
      var c3 = svg.querySelector('#cand-3');
      var c4 = svg.querySelector('#cand-4');
      var c5 = svg.querySelector('#cand-5');

      if (c1) {
        var s1 = Math.sin(now * 0.003) * 0.8;
        c1.setAttribute('transform', 'translate(32 ' + (116 + s1) + ')');
      }
      if (c2) {
        var s2 = Math.cos(now * 0.0035) * 0.8;
        c2.setAttribute('transform', 'translate(104 ' + (94 + s2) + ')');
      }
      if (c3) {
        var s3 = Math.sin(now * 0.004) * 0.8;
        c3.setAttribute('transform', 'translate(140 ' + (94 + s3) + ')');
      }
      if (c4) {
        var s4 = Math.cos(now * 0.004) * 0.7;
        c4.setAttribute('transform', 'translate(202 ' + (94 + s4) + ')');
      }
      if (c5) {
        var s5 = Math.sin(now * 0.0032) * 0.8;
        c5.setAttribute('transform', 'translate(238 ' + (94 + s5) + ')');
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

if (loc.indexOf('office') !== -1) enter();
if (loc.indexOf('create2') !== -1) { state = "create"; show("welcome", false); show("create", true); step(2); }
