<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Virtualize: Career Quest</title>
<meta name="description" content="Explore the Virtualize Technologies studio, meet the team, collect XP chips and unlock open positions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080b11;
  --bg-subtle: #0e131f;
  --surface: #131a27;
  --surface-elevated: #1a2335;
  --surface-glass: rgba(18, 24, 37, 0.86);
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.16);
  --ink: #f8fafc;
  --ink-secondary: #cbd5e1;
  --mut: #8b9bb4;
  --faint: #475569;
  --a: #f59e0b;
  --b: #3b82f6;
  --c: #10b981;
  --zc: #f59e0b;
  --rose: #f43f5e;
  --violet: #8b5cf6;
  --teal: #14b8a6;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html, body {
  width: 100dvw;
  height: 100dvh;
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.6 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  margin: 0;
  line-height: 1.15;
  letter-spacing: -0.02em;
}
.mono {
  font-family: 'JetBrains Mono', monospace;
}
button {
  font: inherit;
  cursor: pointer;
  color: inherit;
}
svg { display: block; }
.layer {
  position: fixed;
  inset: 0;
  width: 100dvw;
  height: 100dvh;
}

/* Glowing Orange Cyber Button System */
.btn {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 15.5px;
  border: 2px solid #f97316;
  border-radius: 10px;
  padding: 12px 24px;
  background: rgba(22, 14, 8, 0.92);
  color: #ffedd5;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 0 18px rgba(249, 115, 22, 0.5), inset 0 0 10px rgba(249, 115, 22, 0.25);
  cursor: pointer;
}
.btn:hover {
  background: linear-gradient(180deg, #f97316 0%, #ea580c 100%);
  color: #ffffff;
  border-color: #fed7aa;
  transform: translateY(-2px);
  box-shadow: 0 0 28px rgba(249, 115, 22, 0.9);
}
.btn:active {
  transform: translateY(0);
}
.btn.alt {
  background: rgba(26, 16, 10, 0.88);
  border: 2px solid rgba(249, 115, 22, 0.6);
  color: #fed7aa;
  box-shadow: 0 0 14px rgba(249, 115, 22, 0.35);
}
.btn.alt:hover {
  background: linear-gradient(180deg, #ea580c 0%, #c2410c 100%);
  color: #ffffff;
  border-color: #fed7aa;
  box-shadow: 0 0 26px rgba(249, 115, 22, 0.85);
}
.btn.primary, .press {
  background: linear-gradient(180deg, #f97316 0%, #ea580c 100%);
  color: #ffffff;
  font-weight: 800;
  border: 2.5px solid #fed7aa;
  border-radius: 12px;
  padding: 13px 28px;
  font-size: 16px;
  box-shadow: 0 0 28px rgba(249, 115, 22, 0.85), inset 0 2px 0 rgba(255, 255, 255, 0.45);
}
.btn.primary:hover, .press:hover {
  filter: brightness(1.15);
  box-shadow: 0 0 38px rgba(249, 115, 22, 1);
  transform: translateY(-2px);
}

button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid #f97316;
  outline-offset: 3px;
}

/* Overlays */
.ov {
  position: fixed;
  inset: 0;
  width: 100dvw;
  height: 100dvh;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  text-align: center;
  padding: 16px;
  overflow: hidden;
  box-sizing: border-box;
}


/* Welcome Overlay (Clean, Focused, Responsive with dvh/dvw) */
#welcome {
  position: fixed;
  inset: 0;
  width: 100dvw;
  height: 100dvh;
  z-index: 5;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  gap: 0;
  /* Moved both the logo and buttons inward by 10% (10dvh) symmetrically */
  padding: calc(clamp(14px, 2.5dvh, 26px) + 10dvh) clamp(16px, 3dvw, 36px);
  pointer-events: none;
  box-sizing: border-box;
  overflow: hidden;
  background: transparent;
}
#welcome > * {
  pointer-events: auto;
}

/* 1. BIGGER VIRTUALIZE TECHNOLOGIES LOGO / BANNER (Symmetrically spaced from top) */
.top-banner {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background: rgba(9, 14, 24, 0.94);
  backdrop-filter: blur(12px);
  border: 3px solid #f59e0b;
  border-radius: 14px;
  padding: clamp(10px, 1.8dvh, 18px) clamp(30px, 4.5dvw, 64px);
  box-shadow: 0 0 35px rgba(245, 158, 11, 0.6), inset 0 0 16px rgba(245, 158, 11, 0.3);
  margin: 0;
  transition: transform 0.2s ease;
}
.top-banner::before, .top-banner::after {
  content: '';
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 28px;
  background: #f59e0b;
  clip-path: polygon(0 40%, 100% 0, 100% 100%, 0 60%);
  box-shadow: 0 0 10px rgba(245, 158, 11, 0.8);
}
.top-banner::before { left: -20px; }
.top-banner::after { right: -20px; transform: translateY(-50%) scaleX(-1); }
.top-banner span {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 800;
  font-size: clamp(16px, 2.6dvw, 26px);
  letter-spacing: clamp(2.5px, 0.4dvw, 4.5px);
  color: #fbbf24;
  text-shadow: 0 0 14px rgba(251, 191, 36, 0.85), 0 2px 4px rgba(0, 0, 0, 0.8);
  white-space: nowrap;
}

/* 2. HERO BOX */
.hero-box {
  background: rgba(8, 14, 28, 0.90);
  backdrop-filter: blur(20px);
  border: 2px solid #00f0ff;
  border-radius: 16px;
  padding: clamp(12px, 2.2dvh, 24px) clamp(18px, 3.5dvw, 40px);
  width: min(580px, 92dvw);
  max-width: min(580px, 92dvw);
  box-shadow: 0 0 35px rgba(0, 240, 255, 0.45), inset 0 0 18px rgba(0, 240, 255, 0.15);
  position: relative;
  text-align: center;
  margin: 0 auto;
}
.hero-box::before, .hero-box::after {
  content: '';
  position: absolute;
  width: 16px;
  height: 16px;
  border: 2.5px solid #38bdf8;
  pointer-events: none;
}
.hero-box::before {
  top: -2px; left: -2px;
  border-right: none; border-bottom: none;
  border-top-left-radius: 6px;
}
.hero-box::after {
  bottom: -2px; right: -2px;
  border-left: none; border-top: none;
  border-bottom-right-radius: 6px;
}
#welcome h1 {
  font-size: clamp(18px, 3.2dvw, 32px);
  font-weight: 800;
  color: #ffffff;
  margin: 0 auto 6px;
  line-height: 1.25;
  letter-spacing: -0.3px;
  text-wrap: balance;
  overflow-wrap: break-word;
  word-break: normal;
  background: none;
  -webkit-text-fill-color: initial;
}
#welcome p {
  color: #38bdf8;
  font-size: clamp(11.5px, 1.4dvw, 14px);
  line-height: 1.45;
  margin: 0;
  max-width: 52ch;
  text-wrap: balance;
}
#welcome p b {
  color: #38bdf8;
  font-weight: 700;
}

/* 3. BUTTONS (HORIZONTAL ROW ON PHONE, TABLET, AND PC) - GLOWING ORANGE THEME */
.btn-group {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: clamp(14px, 3dvw, 26px);
  width: 100%;
  margin: 0;
}
.btn.press {
  background: linear-gradient(180deg, #f97316 0%, #ea580c 100%);
  color: #ffffff;
  font-weight: 800;
  font-size: clamp(16px, 1.8dvw, 20px);
  border: 2.5px solid #fed7aa;
  border-radius: 12px;
  padding: clamp(14px, 1.8dvh, 18px) clamp(32px, 4.2dvw, 50px);
  box-shadow: 0 0 30px rgba(249, 115, 22, 0.85), inset 0 2px 0 rgba(255, 255, 255, 0.45);
  letter-spacing: 0.5px;
  text-transform: none;
  white-space: nowrap;
}
.btn.press:hover {
  filter: brightness(1.15);
  box-shadow: 0 0 42px rgba(249, 115, 22, 1);
  transform: translateY(-2px);
}
#exp {
  background: rgba(22, 14, 8, 0.92);
  border: 2.5px solid #f97316;
  color: #fed7aa;
  font-weight: 800;
  font-size: clamp(15px, 1.7dvw, 19px);
  border-radius: 12px;
  padding: clamp(13px, 1.8dvh, 18px) clamp(28px, 3.8dvw, 44px);
  box-shadow: 0 0 24px rgba(249, 115, 22, 0.65), inset 0 0 14px rgba(249, 115, 22, 0.3);
  letter-spacing: 0.4px;
  white-space: nowrap;
}
#exp:hover {
  background: linear-gradient(180deg, #f97316 0%, #ea580c 100%);
  color: #ffffff;
  border-color: #fed7aa;
  box-shadow: 0 0 36px rgba(249, 115, 22, 0.95);
  transform: translateY(-2px);
}

/* RESPONSIVE TUNING FOR IPADS AND MOBILES */
@media (max-width: 1024px) {
  /* On iPads and mobiles: place hero box close to buttons below the building */
  .hero-box {
    margin-top: auto !important;
    margin-bottom: clamp(10px, 1.6dvh, 16px) !important;
    transform: none !important;
    width: min(600px, 92dvw);
    max-width: min(600px, 92dvw);
    padding: clamp(10px, 1.8dvh, 18px) clamp(16px, 3dvw, 32px);
  }
  .btn-group {
    margin-top: 0 !important;
  }
}

@media (max-width: 600px) {
  #welcome {
    padding: calc(clamp(14px, 2dvh, 22px) + 10dvh) 12px;
  }
  .top-banner {
    margin: 0;
    padding: 10px 24px;
    border-width: 2.5px;
  }
  .top-banner span {
    font-size: 15px;
    letter-spacing: 2px;
  }
  .hero-box {
    margin: auto auto clamp(10px, 1.5dvh, 14px) auto !important;
    padding: 10px 14px;
    width: 86dvw;
    max-width: 86dvw;
    transform: none !important;
  }
  #welcome h1 {
    font-size: 16.5px;
    line-height: 1.22;
    margin-bottom: 4px;
  }
  #welcome p {
    font-size: 11px;
    line-height: 1.35;
  }
  .btn-group {
    flex-direction: row;
    gap: 12px;
    margin: 0;
  }
  .btn.press {
    padding: 11px 20px;
    font-size: 14.5px;
    border-radius: 10px;
  }
  #exp {
    padding: 11px 18px;
    font-size: 14px;
    border-radius: 10px;
  }
}

@media (min-width: 601px) and (max-width: 1024px) {
  .top-banner {
    margin: 0;
  }
  .hero-box {
    margin: auto auto clamp(12px, 1.8dvh, 16px) auto !important;
    width: min(580px, 86dvw);
    transform: none !important;
  }
  #welcome h1 {
    font-size: clamp(18px, 2.5dvw, 24px);
    margin-bottom: 6px;
  }
  #welcome p {
    font-size: clamp(11.5px, 1.4dvw, 13.5px);
  }
  .btn-group {
    margin: 0;
    gap: 16px;
  }
  .btn.press {
    padding: 14px 34px;
    font-size: 17.5px;
  }
  #exp {
    padding: 14px 30px;
    font-size: 16.5px;
  }
}

@media (min-width: 1025px) {
  .top-banner {
    margin: 0;
  }
  .hero-box {
    margin: 0 auto;
    width: 580px;
  }
  .btn-group {
    margin: 0;
  }
}


/* Character Creation Wizard */
#create {
  background: rgba(8, 11, 17, 0.94);
  backdrop-filter: blur(20px);
  display: none;
  z-index: 6;
  justify-content: flex-start;
  overflow-y: auto;
}
.step-card {
  flex: none;
  margin: auto;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 16px;
  padding: 32px;
  max-width: min(720px, calc(100vw - 32px));
  width: 100%;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  box-sizing: border-box;
}
#create h2 {
  font-size: clamp(20px, 3vw, 26px);
  margin: 0;
  text-align: center;
  line-height: 1.25;
}
input[type=text] {
  font: 600 20px 'Space Grotesk', sans-serif;
  text-align: center;
  background: var(--surface-elevated);
  color: var(--ink);
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  padding: 14px 20px;
  width: 100%;
  max-width: 360px;
  box-sizing: border-box;
  transition: all 0.2s;
}
input[type=text]:focus {
  border-color: #38bdf8;
  box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
}
@keyframes inputShake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-6px); }
  40%, 80% { transform: translateX(6px); }
}
input[type=text].input-invalid {
  border-color: #f87171 !important;
  box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.35) !important;
  animation: inputShake 0.35s ease;
}
.name-error-msg {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  color: #f87171;
  font-size: 13.5px;
  font-weight: 600;
  margin-top: -10px;
  margin-bottom: -4px;
  font-family: 'Space Grotesk', sans-serif;
  letter-spacing: 0.01em;
}
.name-error-msg svg {
  flex-shrink: 0;
  width: 16px;
  height: 16px;
}

.avs {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 14px;
  width: 100%;
}
.av {
  background: var(--surface-elevated);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 10px;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 8px;
}
.av:hover {
  background: #202b40;
  border-color: rgba(255, 255, 255, 0.2);
  transform: translateY(-2px);
}
.av[aria-pressed=true] {
  border-color: #38bdf8;
  background: #19273c;
  box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.3), 0 8px 24px rgba(0, 0, 0, 0.4);
}
.av svg {
  width: 100%;
  height: 140px;
}
.av b {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 600;
  font-size: 13px;
  color: var(--ink);
}
.av span {
  font-size: 11px;
  color: var(--mut);
  line-height: 1.4;
}

.row {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 10px;
  flex-wrap: nowrap;
  width: 100%;
  max-width: 100%;
  box-sizing: border-box;
}

.sw {
  width: 44px;
  height: 44px;
  max-width: calc((100% - 50px) / 6);
  aspect-ratio: 1 / 1;
  border-radius: 10px;
  border: 2px solid rgba(255, 255, 255, 0.15);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
  flex-shrink: 0;
  box-sizing: border-box;
}
@media (max-width: 600px) {
  #create {
    padding: 16px 12px;
  }
  .step-card {
    padding: 22px 14px;
    max-width: 100%;
  }
  input[type=text] {
    font-size: 17px;
    padding: 12px 14px;
    width: 100%;
    max-width: 100%;
  }
  .row {
    gap: 8px;
    flex-wrap: nowrap;
  }
  .sw {
    width: 38px;
    height: 38px;
    max-width: calc((100% - 40px) / 6);
    flex-shrink: 1;
  }
  .avs {
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .av svg {
    height: 110px;
  }
}
@media (max-width: 360px) {
  .step-card {
    padding: 20px 10px;
  }
  .row {
    gap: 5px;
  }
  .sw {
    width: 32px;
    height: 32px;
    max-width: calc((100% - 25px) / 6);
    border-radius: 8px;
  }
}
.sw:hover {
  transform: translateY(-2px) scale(1.08);
  border-color: rgba(255, 255, 255, 0.6);
  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.45);
}
.sw[aria-pressed=true] {
  border-color: #ffffff;
  transform: translateY(-3px) scale(1.12);
  box-shadow: 0 0 16px rgba(255, 255, 255, 0.65), 0 6px 16px rgba(0, 0, 0, 0.5);
}

/* Studio ID Pass Card */
.id {
  width: 100%;
  max-width: 380px;
  box-sizing: border-box;
  border-radius: 14px;
  padding: 18px;
  text-align: left;
  display: flex;
  gap: 14px;
  align-items: center;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.2);
  position: relative;
  overflow: hidden;
}
.id > div {
  min-width: 0;
  flex: 1;
  overflow: hidden;
}
.id::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  width: 120px;
  height: 120px;
  background: radial-gradient(circle at top right, rgba(255, 255, 255, 0.15), transparent 70%);
  pointer-events: none;
}
.id svg {
  width: 90px;
  height: 110px;
  flex: none;
  background: rgba(0, 0, 0, 0.25);
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.1);
}
.id h3 {
  font-size: 19px;
  margin: 2px 0;
}
.id small {
  display: block;
  opacity: 0.9;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
}
.step-actions {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  gap: 14px;
  justify-content: center;
  align-items: center;
  width: 100%;
}
@media (max-width: 600px) {
  .step-actions {
    flex-direction: column;
    gap: 10px;
    width: 100%;
  }
  .step-actions .btn {
    width: 100%;
    max-width: 320px;
  }
}

/* Office Floor: fits the screen as a 3x3 grid, scrolls as columns on tablets and phones */
#floor {
  position: fixed;
  inset: 0;
  z-index: 1;
  display: none;
  overflow: hidden;
}
#game {
  width: 100%;
  height: 100%;
}
.floor-scroll #floor {
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  touch-action: manipulation;
  scrollbar-width: thin;
  scrollbar-color: #f97316 transparent;
  padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
.floor-scroll #game {
  position: relative;
  inset: auto;
  height: auto;
}

/* Top Navigation & Telemetry HUD Dock */
#top-bar {
  position: fixed;
  z-index: 4;
  display: none;
  align-items: center;
  justify-content: space-between;
  pointer-events: none;
  box-sizing: border-box;
}
#top-bar > * {
  pointer-events: auto;
}
#nav {
  display: inline-flex;
  width: max-content;
  flex: 0 0 auto;
  gap: 6px;
  align-items: center;
  margin: 0;
  padding: 0;
  white-space: nowrap;
}
#nav .btn {
  height: 38px;
  box-sizing: border-box;
  padding: 0 13px;
  font-size: 12.5px;
  gap: 6px;
  font-weight: 700;
  background: rgba(22, 14, 8, 0.92);
  backdrop-filter: blur(16px);
  border: 1.5px solid #f97316;
  color: #ffedd5;
  border-radius: 9px;
  box-shadow: 0 0 16px rgba(249, 115, 22, 0.45);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
#nav .btn:hover {
  background: linear-gradient(180deg, #f97316 0%, #ea580c 100%);
  color: #ffffff;
  border-color: #fed7aa;
  box-shadow: 0 0 24px rgba(249, 115, 22, 0.85);
}

#hud {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  margin: 0;
  padding: 0;
}
#hud .bar {
  height: 38px;
  box-sizing: border-box;
  background: rgba(9, 14, 24, 0.94);
  backdrop-filter: blur(20px);
  border: 1.5px solid #00f0ff;
  border-radius: 9px;
  padding: 4px 14px 5px;
  font-family: 'Space Grotesk', sans-serif;
  box-shadow: 0 0 20px rgba(0, 240, 255, 0.4), inset 0 0 10px rgba(0, 240, 255, 0.12);
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 3px;
}
.hud-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
#mt {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 800;
  font-size: 12px;
  color: #ffffff;
  letter-spacing: 0.05em;
  text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
  white-space: nowrap;
}
.track {
  height: 5px;
  background: rgba(255, 255, 255, 0.12);
  border-radius: 4px;
  overflow: hidden;
  position: relative;
}
#xpb {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #f59e0b 0%, #fbbf24 100%);
  border-radius: 4px;
  box-shadow: 0 0 12px rgba(251, 191, 36, 0.85);
  transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}
#xpt {
  color: #38bdf8;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 11px;
  text-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
  white-space: nowrap;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
#mt { flex: none; }
.lbl-short { display: none; }

/* Touch screens that keep the 3x3 grid (iPad landscape, iPad Pro) */
@media (pointer: coarse) {
  :root:not(.floor-scroll) #nav .btn {
    height: 44px;
    padding: 0 14px;
    font-size: 14px;
  }
  :root:not(.floor-scroll) #hud .bar {
    height: 44px;
  }
}
@media (hover: none) {
  #nav .btn:hover {
    background: rgba(22, 14, 8, 0.92);
    color: #ffedd5;
    border-color: #f97316;
    box-shadow: 0 0 16px rgba(249, 115, 22, 0.45);
    transform: none;
  }
}

/* Tablets and phones: bar docks to the top edge and the floor scrolls beneath it */
/* --inset-l and --inset-r come from syncTopBar so the bar lines up with the room edges */
.floor-scroll #top-bar {
  top: 0;
  left: 0;
  right: 0;
  gap: 8px 10px;
  padding: calc(env(safe-area-inset-top, 0px) + clamp(18px, 3.4dvh, 30px)) var(--inset-r, 20px) 20px var(--inset-l, 20px);
  background: linear-gradient(180deg, rgba(5, 8, 16, 0.97) 0%, rgba(5, 8, 16, 0.94) 72%, rgba(5, 8, 16, 0) 100%);
  pointer-events: none;
}
.floor-scroll #nav {
  gap: 8px;
}
.floor-scroll #nav .btn {
  height: 42px;
  padding: 0 14px;
  font-size: 13.5px;
}
.floor-scroll #hud {
  flex: 1 1 0;
  min-width: 0;
}
.floor-scroll #hud .bar {
  width: 100%;
  min-width: 0;
  height: 42px;
  padding: 5px 14px 6px;
  gap: 5px;
}
.floor-scroll .track {
  height: 6px;
}
.floor-scroll #mt {
  font-size: 12.5px;
}
.floor-scroll #xpt {
  font-size: 11.5px;
}
.floor-scroll .mt-long {
  display: none;
}
/* Portrait phones and small tablets: buttons on one row, XP bar full width below */
@media (max-width: 760px) and (min-height: 501px), (max-width: 540px) {
  .floor-scroll #top-bar {
    flex-direction: column;
    align-items: stretch;
  }
  .floor-scroll #nav {
    width: 100%;
  }
  .floor-scroll #nav .btn {
    flex: 1 1 auto;
    padding: 0 8px;
  }
  .floor-scroll #hud {
    flex: none;
  }
}
/* Narrow phones and landscape phones: shorter button label so nothing gets shrunk */
@media (max-width: 480px), (max-height: 500px) {
  .floor-scroll .lbl-long { display: none; }
  .floor-scroll .lbl-short { display: inline; }
}
/* Phones: a slimmer bar so the screen doesn't feel crowded */
@media (max-width: 600px), (max-height: 500px) {
  .floor-scroll #nav .btn {
    height: 36px;
    padding: 0 6px;
    font-size: 12.5px;
    border-radius: 8px;
  }
  .floor-scroll #hud .bar {
    height: 38px;
    padding: 4px 11px 5px;
    gap: 4px;
  }
  .floor-scroll .track {
    height: 5px;
  }
  .floor-scroll #mt {
    font-size: 11.5px;
  }
  .floor-scroll #xpt {
    font-size: 10.5px;
  }
}
@media (max-height: 500px) {
  .floor-scroll #top-bar {
    padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
    padding-bottom: 14px;
  }
  .floor-scroll #nav .btn {
    padding: 0 11px;
  }
}
/* Smallest phones: the rooms are narrower here, so the buttons tighten up to match */
@media (max-width: 350px) {
  .floor-scroll #nav {
    gap: 5px;
  }
  .floor-scroll #nav .btn {
    padding: 0 4px;
    font-size: 12px;
  }
}

/* Collected chip flying up to the XP bar */
#fx {
  position: fixed;
  inset: 0;
  z-index: 8;
  overflow: hidden;
  pointer-events: none;
}
.reward-chip {
  position: absolute;
  left: 0;
  top: 0;
  width: 48px;
  height: 48px;
  margin: -24px 0 0 -24px;
  will-change: transform;
}
.reward-chip svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}
.reward-spark {
  position: absolute;
  left: 0;
  top: 0;
  border-radius: 50%;
}
.reward-float {
  position: absolute;
  left: 0;
  top: 0;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 15px;
  color: #fde047;
  text-shadow: 0 0 10px rgba(250, 204, 21, 0.9), 0 2px 4px rgba(0, 0, 0, 0.9);
  white-space: nowrap;
}

/* Modals & Dialogs */
#modal {
  position: fixed;
  inset: 0;
  z-index: 6;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(8, 11, 17, 0.78);
  backdrop-filter: blur(12px);
  cursor: pointer;
}
.card {
  cursor: default;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 18px;
  padding: 28px;
  width: min(540px, 100%);
  max-height: 85vh;
  overflow: auto;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
  animation: cardIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  text-align: left;
}
@keyframes cardIn {
  from { transform: translateY(20px) scale(0.97); opacity: 0; }
  to { transform: translateY(0) scale(1); opacity: 1; }
}
.card h2 {
  font-size: 24px;
  margin-bottom: 8px;
  color: var(--ink);
}
.card p {
  color: var(--mut);
  margin: 10px 0;
}
.fact {
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-left: 3px solid #f59e0b;
  border-radius: 10px;
  padding: 16px;
  font-size: 14px;
  color: var(--ink-secondary);
  line-height: 1.6;
}

.mp {

@media (min-width: 860px) {

/* Top-left back button shared by Meet the Team and Open positions */

/* Meet the Team Modal */
.team-modal {
  width: min(840px, 94vw);
  max-height: 90vh;
  overflow-y: auto;
  background: rgba(10, 15, 26, 0.96);
  border: 1.5px solid #f97316;
  border-radius: 18px;
  padding: 24px;
  box-shadow: 0 0 40px rgba(249, 115, 22, 0.25), 0 20px 50px rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(20px);
  position: relative;
  box-sizing: border-box;
  color: #f8fafc;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.team-header {
  flex: none;
  text-align: center;
}
/* Back button on the left, title centred: the equal side columns keep the title in the middle */
.team-top {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.team-top .back-btn {
  justify-self: start;
}
.team-header h2 {
  font-size: clamp(22px, 3.2vw, 26px);
  font-weight: 800;
  color: #ffffff;
  margin: 0;
  letter-spacing: -0.01em;
}
.team-header p {
  color: #94a3b8;
  font-size: 13.5px;
  margin: 0;
  line-height: 1.45;
}
.team-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 12px;
  width: 100%;
}
.team-card {
  display: flex;
  align-items: center;
  gap: 14px;
  background: rgba(15, 23, 42, 0.85);
  border: 1.5px solid var(--border-strong);
  border-radius: 14px;
  padding: 12px 14px;
  cursor: pointer;
  transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
  text-align: left;
  position: relative;
  overflow: hidden;
  box-sizing: border-box;
}
.team-card:hover,
.team-card:focus-visible {
  border-color: var(--zc, #fb923c);
  background: rgba(30, 41, 59, 0.95);
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), 0 0 14px rgba(251, 146, 60, 0.25);
  outline: none;
}
.team-avatar-box {
  width: 52px;
  height: 52px;
  border-radius: 11px;
  background: radial-gradient(circle at 50% 30%, rgba(56, 189, 248, 0.2), transparent 70%), #0d131f;
  border: 1.5px solid var(--zc, #38bdf8);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
}
.team-avatar-box svg {
  width: 92%;
  height: 92%;
  transform: translateY(2px);
}
.team-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  flex: 1;
}
.team-name {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 15px;
  color: #f8fafc;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: -0.01em;
}
.team-role {
  font-size: 12.5px;
  color: #94a3b8;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.team-dept {
  align-self: flex-start;
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  letter-spacing: 0.05em;
  padding: 2px 7px;
  border-radius: 6px;
  margin-top: 3px;
  border: 1px solid;
}
.team-arrow {
  color: #64748b;
  font-size: 16px;
  font-weight: 700;
  transition: transform 0.2s, color 0.2s;
  flex-shrink: 0;
}
.team-card:hover .team-arrow {
  color: var(--zc, #fb923c);

}
/* Phones: a compact list that scrolls on its own, so the back button is always on screen */

  width: 50px;
  height: 50px;
  border-radius: 12px;
  background: rgba(251, 146, 60, 0.15);
  border: 1.5px solid #fb923c;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
  box-shadow: 0 0 14px rgba(251, 146, 60, 0.25);
}
.game-card-icon.blaster {
  background: rgba(56, 189, 248, 0.15);
  border-color: #38bdf8;
  box-shadow: 0 0 14px rgba(56, 189, 248, 0.25);
}
.game-card-details {
  flex: 1;
}
.game-card-details h3 {
  font-size: 15.5px;
  font-weight: 700;
  color: #ffffff;
  margin: 0 0 3px;
}
.game-card-details p {
  color: #94a3b8;
  font-size: 12px;
  margin: 0 0 5px;
  line-height: 1.35;
}
.game-card-meta {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: #fb923c;
  font-weight: 700;
  letter-spacing: 0.06em;
}
.game-card-meta.cyan {
  color: #38bdf8;
}
.game-card-action {
  font-size: 13px;
  font-weight: 700;
  color: #fed7aa;
  display: flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}
.arcade-game-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  width: 100%;
}
.arcade-game-top {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 2px;
}
.arcade-game-title {
  font-size: 15px;
  font-weight: 800;
  color: #ffffff;
  letter-spacing: 0.04em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.arcade-sub-btn {
  padding: 5px 12px !important;
  font-size: 11.5px !important;
  border-radius: 8px !important;
}
.game-hud-bar {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12.5px;
  font-weight: 700;
  padding: 6px 12px;
  background: rgba(14, 20, 34, 0.9);
  border: 1px solid rgba(251, 146, 60, 0.3);
  border-radius: 8px;
  box-sizing: border-box;
}
.arcade-canvas-wrap {
  width: 100%;
  border-radius: 12px;
  overflow: hidden;
  border: 2px solid #38bdf8;
  box-shadow: 0 0 24px rgba(56, 189, 248, 0.35);
  position: relative;
  background: #060913;
}
.arcade-canvas-wrap.orange-border {
  border-color: #fb923c;
  box-shadow: 0 0 24px rgba(251, 146, 60, 0.35);
}
.arcade-canvas-wrap canvas {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 16 / 9;
  cursor: crosshair;
  touch-action: none;
}
.game-controls-hint {
  font-size: 11.5px;
  color: #94a3b8;
  text-align: center;
  font-family: 'Space Grotesk', sans-serif;
  margin-top: 2px;
}
@media (max-width: 600px) {
  #modal:has(.arcade-modal) {
    padding: 22px;
  }
  .arcade-modal {
    width: 100%;
    padding: 13px;
    gap: 11px;
  }
  .arcade-header h2 {
    font-size: 19px;
  }
  .game-card-select {
    padding: 11px 12px;
    gap: 10px;
  }
  .game-card-icon {
    width: 42px;
    height: 42px;
    font-size: 20px;
  }
  .game-card-action {
    font-size: 12px;
  }
}
/* Landscape phones: size the table from the height so the whole game stays on screen */
@media (max-height: 500px) {
  #modal:has(.arcade-modal) {
    padding: 6px;
  }
  .arcade-modal {
    width: min(680px, 100%);
    max-height: calc(100dvh - 12px);
    padding: 8px 12px;
    gap: 6px;
  }
  .arcade-game-container {
    gap: 5px;
  }
  .arcade-canvas-wrap {
    width: auto;
    max-width: 100%;
  }
  .arcade-canvas-wrap canvas {
    width: auto;
    height: calc(100dvh - 118px);
  }
  .arcade-modal .game-controls-hint {
    display: none;
  }
}

/* Careers Overlay & Job Postings - Fully Scrollable */
#careers {
  position: fixed;
  inset: 0;
  width: 100dvw;
  height: 100dvh;
  background: var(--bg);
  z-index: 7;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: clamp(24px, 4dvh, 48px) clamp(16px, 3dvw, 32px);
  text-align: left;
  overflow-y: auto !important;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  box-sizing: border-box;
}
#careers::-webkit-scrollbar {
  width: 8px;
}
#careers::-webkit-scrollbar-track {
  background: rgba(10, 14, 24, 0.8);
}
#careers::-webkit-scrollbar-thumb {
  background: #f97316;
  border-radius: 4px;
  box-shadow: 0 0 10px rgba(249, 115, 22, 0.7);
}
#careers::-webkit-scrollbar-thumb:hover {
  background: #ea580c;
}
.careers-container {
  width: min(960px, 100%);
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 24px;
  padding-bottom: clamp(60px, 10dvh, 100px);
}
/* The list is long, so the back button stays pinned top-left while scrolling */
.careers-container > .back-btn {
  position: sticky;
  /* Sticky offsets start below the page's top padding, so subtract it to sit 14px from the edge */
  top: calc(14px - clamp(24px, 4dvh, 48px));
  z-index: 2;
  align-self: flex-start;
  flex: none;
  margin-bottom: -6px;
}
.careers-container > .back-btn:not(:hover) {
  background: #160e08;
}
.careers-header {
  border-bottom: 1px solid var(--border);
  padding-bottom: 20px;
}
.careers-header h2 {
  font-size: clamp(28px, 3.6vw, 42px);
  margin-bottom: 8px;
}
.careers-header p {
  color: var(--mut);
  margin: 0;
  font-size: 15px;
}
.jobs {
  display: grid;
  grid-template-columns: 1fr;
  gap: 18px;
}
.job {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 14px;
  padding: 24px;
  transition: all 0.2s;
}
.job:hover {
  border-color: rgba(255, 255, 255, 0.25);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
}
.job h3 {
  font-size: 20px;
  margin-bottom: 6px;
  color: var(--ink);
}
.job p {
  margin: 8px 0;
  color: var(--mut);
  font-size: 14px;
}
.job-meta-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 8px 0 14px;
}
.tag {
  display: inline-flex;
  align-items: center;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 3px 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--ink-secondary);
}
.tag.dept {
  color: #38bdf8;
  border-color: rgba(56, 189, 248, 0.25);
  background: rgba(56, 189, 248, 0.08);
}
.jd {
  margin: 14px 0;
  border-top: 1px solid var(--border);
  padding-top: 12px;
}
.jd summary {
  cursor: pointer;
  color: #38bdf8;
  font-weight: 600;
  font-size: 13px;
  font-family: 'Space Grotesk', sans-serif;
  user-select: none;
}
.jd summary:hover {
  text-decoration: underline;
}
.jd ul {
  padding-left: 20px;
  margin: 8px 0;
  font-size: 14px;
  color: var(--ink-secondary);
}
.jd li {
  margin: 5px 0;
}
.jd h4 {
  margin: 14px 0 4px;
  color: #cbd5e1;
  font-size: 14px;
}

/* Toast Notifications */
#toast {
  position: fixed;
  left: 50%;
  bottom: 84px;
  transform: translateX(-50%);
  background: var(--surface-elevated);
  border: 1px solid var(--border-strong);
  color: var(--ink);
  padding: 10px 20px;
  border-radius: 8px;
  z-index: 9;
  display: none;
  max-width: 90vw;
  font-weight: 600;
  font-size: 13px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  font-family: 'Space Grotesk', sans-serif;
}

/* Interactive SVG Elements */
.hit {
  cursor: pointer;
  transition: opacity 0.2s;
}
.hit:hover {
  filter: brightness(1.15);
}
.hit.sel {
  filter: drop-shadow(0 0 4px rgba(245, 158, 11, 0.6));
}
.chip {
  cursor: pointer;
  outline: none;
}
.chip-shadow {
  transition: opacity 0.15s;
}
.chip-body {
  transition: filter 0.2s;
}
.chip:hover .chip-body {
  filter: brightness(1.3) drop-shadow(0 0 6px #ffffff) drop-shadow(0 0 14px #ffffff) !important;
}
.chip.got {
  pointer-events: none;
  animation: chipGone 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
.chip.got .chip-body,
.chip.got .chip-shadow {
  display: none;
}
@keyframes chipGone {
  to { transform: translateY(-30px) scale(1.4); opacity: 0; }
}
</style>

    g += Pa('M'+(x+5)+' '+(y+h-6)+'Q'+(x+w*0.35)+' '+(y+9)+' '+(x+w*0.65)+' '+(y+13)+'T'+(x+w-5)+' '+(y+6)+'v'+(h-11)+'H'+(x+5)+'Z', 'rgba(56,189,248,0.12)');

    g += R(x + 5, y + 4.5, 9, 3, '#0369a1', 0.8);
  } else if (k === 'game') {
    g += R(x + 4, y + 4, w - 8, h - 8, '#1e1b4b', 1.5);

  g += R(x + w / 2 - 9, y + h + 5, 18, 2.5, '#1e293b', 1);
  return g;

function chairb(x, y, c) {
  var meshColor = c || '#1e293b';
  var g = '';
  g += Ci(x + 28, y + 54, 14, 'rgba(0,0,0,0.3)');
  for (var a = 0; a < 5; a++) {
    var rad = (a * 72 * Math.PI) / 180;
    var bx = x + 28 + Math.cos(rad) * 14;
    var by = y + 54 + Math.sin(rad) * 10;
    g += St('M'+(x+28)+' '+(y+54)+'L'+bx+' '+by, '#0f172a', 2.5);
    g += Ci(bx, by, 1.8, '#334155');

  g += R(x + 26, y + 42, 4, 12, '#475569', 1);
  g += R(x + 5, y + 26, 46, 18, mix(meshColor, -0.2), 6);
  g += R(x + 7, y + 27, 42, 14, meshColor, 5);

  g += R(x + 1, y + 16, 7, 18, '#0f172a', 3);
  g += R(x + 48, y + 16, 7, 18, '#0f172a', 3);
  return g;
}

function shelf(x, y, w, rows) {
  var g = R(x, y, w, rows * 36 + 8, '#131926', 4, ' stroke="#243046" stroke-width="1.2"');
  for (var r = 0; r < rows; r++) {
    g += R(x + 4, y + 4 + r * 36 + 32, w - 8, 3.5, '#4a3828', 1);
    for (var i = 0, bx = x + 8; bx < x + w - 16; i++) {
      var bw = 6 + (i * 7) % 8, bh = 20 + (i * 5) % 11;
      var bc = ['#1d4ed8', '#047857', '#b45309', '#6d28d9', '#be123c', '#334155'][(i + r * 2) % 6];
      g += R(bx, y + 4 + r * 36 + 32 - bh, bw, bh, bc, 1);
      bx += bw + 2.5;
    }
  }
  return g;
}

function sofa(x, y, w, c) {
  var base = c || '#7c2d12';
  var g = '';
  g += R(x + 4, y + 38, w - 8, 8, 'rgba(0,0,0,0.35)', 4);
  g += St('M'+(x+8)+' '+(y+36)+'L'+(x+5)+' '+(y+44), '#1c1917', 2.5);
  g += St('M'+(x+w-8)+' '+(y+36)+'L'+(x+w-5)+' '+(y+44), '#1c1917', 2.5);
  g += R(x + 8, y + 2, w - 16, 26, mix(base, -0.22), 8);
  g += R(x + 10, y + 4, w - 20, 22, base, 6);
  for (var i = 1; i <= 3; i++) {
    var sx = x + 10 + i * ((w - 20) / 4);
    g += St('M'+sx+' '+(y+6)+'L'+sx+' '+(y+24), mix(base, -0.35), 1.2);
  }
  g += R(x + 2, y + 16, w - 4, 22, mix(base, -0.1), 6);
  g += R(x + 12, y + 18, (w - 28) / 2, 18, mix(base, 0.15), 4);
  g += R(x + 16 + (w - 28) / 2, y + 18, (w - 28) / 2, 18, mix(base, 0.15), 4);
  g += R(x, y + 10, 13, 28, mix(base, -0.15), 5);
  g += R(x + 1.5, y + 11, 10, 12, mix(base, 0.2), 3);
  g += R(x + w - 13, y + 10, 13, 28, mix(base, -0.15), 5);
  g += R(x + w - 11.5, y + 11, 10, 12, mix(base, 0.2), 3);
  return g;
}

function skyW(x, y, w, h) {

function buildGame() {

      '<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>'+
    '</filter>'+
    '<linearGradient id="fl" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0" stop-color="#151b29"/>'+
      '<stop offset="1" stop-color="#0d121c"/>'+
    '</linearGradient>';

  CONFIG.zones.forEach(function(z) {
    d += '<linearGradient id="w'+z.id+'" x1="0" y1="0" x2="0" y2="1">'+
           '<stop offset="0" stop-color="'+mix(z.wall, 0.15)+'"/><stop offset="1" stop-color="'+mix(z.wall, -0.2)+'"/></linearGradient>'+
         '<linearGradient id="f'+z.id+'" x1="0" y1="0" x2="0" y2="1">'+
           '<stop offset="0" stop-color="'+mix(z.floor, 0.15)+'"/><stop offset="1" stop-color="'+mix(z.floor, -0.25)+'"/></linearGradient>';
  });
  d += '</defs>';

  var s = d + R(0, 0, FLOOR.w, FLOOR.h, "rgba(4,7,16,0.35)");
  FLOOR.halls.forEach(function(l) { s += R(l[0], l[1], l[2], l[3], "url(#fl)"); });

    s += l[2] > l[3] ? R(l[0], l[1] + 11, l[2], 2, "#334155", 0, ' opacity="0.4"')
                     : R(l[0] + 11, l[1], 2, l[3], "#334155", 0, ' opacity="0.4"');
  });

  CONFIG.zones.forEach(function(z) { s += room(z); });
  CONFIG.chips.forEach(function(c) {
    var home = chipHome(c);
    s += chipG(c, home[0], home[1]);
  });

  $("game").innerHTML = s;
}

function chipHome(c) {
  var z = c.zone ? zoneOf(c.zone) : {x: 0, y: 0};
  var p = (!c.zone && FLOOR.hub) || c.p;
  return [z.x + p[0], z.y + p[1]];
}

/* Floor Layout: desktop keeps the CONFIG grid, smaller screens stack rooms in CONFIG order */
var floor = $("floor"), FLOOR = {cols: 3, w: 1200, h: 900, hub: null, halls: []};
CONFIG.zones.forEach(function(z){ z.gx = z.x; z.gy = z.y; });

function floorCols(){
  if (innerWidth >= 1024) return 3;
  return innerWidth <= 600 && innerHeight > 500 ? 1 : 2;
}

function layoutFloor(cols){
  FLOOR.cols = cols;
  document.documentElement.classList.toggle("floor-scroll", cols < 3);
  if (cols === 3) {
    CONFIG.zones.forEach(function(z){ z.x = z.gx; z.y = z.gy; });
    FLOOR.w = 1200;
    FLOOR.h = 900;
    FLOOR.hub = null;
    FLOOR.halls = [[0, 293, 1200, 24], [0, 583, 1200, 24], [393, 0, 24, 900], [783, 0, 24, 900]];
    return;
  }

  // Wider side padding shrinks the rooms too, since the floor always fills the screen width
  var rw = 360, rh = 260, padX = cols === 1 ? 38 : 40, top = 30, gapX = 30, gapY = cols === 1 ? 56 : 48, step = rh + gapY;
  var rows = 1 + Math.ceil((CONFIG.zones.length - 1) / cols);
  FLOOR.padX = padX;
  FLOOR.w = cols * rw + (cols - 1) * gapX + padX * 2;
  FLOOR.h = top + rows * step - gapY + 56;
  // First room (CEO Cabin) gets its own centred row, the other eight fill the columns
  CONFIG.zones.forEach(function(z, i){
    var col = i === 0 ? (cols - 1) / 2 : (i - 1) % cols;
    z.x = padX + col * (rw + gapX);
    z.y = top + (i === 0 ? 0 : Math.ceil(i / cols)) * step;
  });

  FLOOR.halls = [];
  for (var r = 1; r < rows; r++) FLOOR.halls.push([0, top + r * step - gapY / 2 - 12, FLOOR.w, 24]);
  if (cols === 2) FLOOR.halls.push([FLOOR.w / 2 - 12, FLOOR.halls[0][1], 24, FLOOR.h - FLOOR.halls[0][1]]);

  // The corridor chip sits in the hallway just before the QA Testing Arena
  FLOOR.hub = [cols === 1 ? padX + 40 : FLOOR.w / 2, top + (cols === 1 ? 6 : 3) * step - gapY / 2];
}

function focusZone(z){
  if (FLOOR.cols === 3) { goVB(fitZ(z, true)); return; }
  var scale = svg.getBoundingClientRect().width / FLOOR.w;
  floor.scrollTo({top: (z.y - 24) * scale, behavior: RM ? "auto" : "smooth"});
}

/* Camera System */
var svg = $("game"), vb = [0, 0, 1200, 900], tw = 0;
function setVB(a){ svg.setAttribute("viewBox", a.join(" ")); }
function goVB(to){
  var from = vb.slice(), t0 = performance.now();
  cancelAnimationFrame(tw);
  (function st(t){
    var p = Math.min(1, (t - t0) / (RM ? 1 : 550)), e = 1 - Math.pow(1 - p, 3);
    vb = from.map(function(v, i){ return v + (to[i] - v) * e; });
    setVB(vb);
    if (p < 1) tw = requestAnimationFrame(st);
  })(t0);
}
function ovVB(){
  if (FLOOR.cols < 3) return [0, 0, FLOOR.w, FLOOR.h];
  var a = innerWidth / innerHeight, baseH = 1040, baseW = 1240;
  var w = baseW, h = baseH;
  if (a > w / h) w = h * a; else h = w / a;
  return [600 - w / 2, 450 - h / 2 - 40, w, h];
}
function fitZ(z, sh){
  var a = innerWidth / innerHeight, w = z.w * 1.55, h = w / a;
  if (h < z.h * 1.5) { h = z.h * 1.5; w = h * a; }
  var cx = z.x + z.w / 2, cy = z.y + z.h / 2;
  if (sh) {
    if (innerWidth >= 860) cx += w * 0.2; else cy += h * 0.17;
  }
  return [cx - w / 2, cy - h / 2, w, h];
}

        }).join("") +

  } else if (s === 4) {
    var isReturning = isReturningUser;
    var title = isReturning ? ("Welcome back, " + esc(P.name) + "!") : "Player profile created.";
    var actions = isReturning
      ? '<div class="step-actions">' +
          '<button class="btn primary" id="nx">Enter the virtual world</button>' +
          '<button class="btn" id="btn-new-profile">Create new profile</button>' +
        '</div>'
      : '<button class="btn primary" id="nx">Enter the virtual world</button>';

    h = '<div class="step-card"><h2>' + title + '</h2>'+
        idCard() +
        actions + '</div>';
  }

  el.innerHTML = h;
  var nx = $("nx");
  if (s === 1) $("nm").focus();

  var btnNewProfile = $("btn-new-profile");
  if (btnNewProfile) {
    btnNewProfile.onclick = function(){
      beep(380);
      isCreatingNew = true;
      isReturningUser = false;
      P.name = "";
      P.av = 0;
      P.col = 1;
      P.id = "VQ-" + (1000 + Math.floor(Math.random() * 9000));
      step(1);
    };

  el.querySelectorAll(".av").forEach(function(b){
    b.onclick = function(){
      P.av = +b.dataset.i;
      beep(440 + P.av * 60);
      step(2);

  });
  el.querySelectorAll(".sw").forEach(function(b){
    b.onclick = function(){
      P.col = +b.dataset.i;
      step(3);
    };
  });
  nx.onclick = function(){
    if (s === 1) {
      var inp = $("nm");
      var val = (inp ? inp.value : "").trim();
      var letters = 0;
      try { letters = (val.match(/\p{L}/gu) || []).length; } catch (e) { letters = (val.match(/[a-zA-Z]/g) || []).length; }
      if (letters < 2) {
        var err = $("nm-err");
        if (inp) {
          inp.classList.remove("input-invalid");
          void inp.offsetWidth;
          inp.classList.add("input-invalid");
          inp.focus();
        }
        if (err) err.style.display = "flex";
        beep(240);
        return;
      }
      P.name = val;

    if (s === 3) {
      saveProfile();
    }
    if (s < 4) {
      step(s + 1);

      saveProfile();
      isCreatingNew = false;
      isReturningUser = true;
      enter();
    }
  };
  if (s === 1) {
    var inp = $("nm");
    var err = $("nm-err");
    if (inp) {
      inp.oninput = function(){
        var val = inp.value.trim();
        var letters = 0;
        try { letters = (val.match(/\p{L}/gu) || []).length; } catch (e) { letters = (val.match(/[a-zA-Z]/g) || []).length; }
        if (letters >= 2) {
          inp.classList.remove("input-invalid");
          if (err) err.style.display = "none";
        }
      };
      inp.onkeydown = function(e){
        if (e.key === "Enter") {
          e.preventDefault();
          nx.click();
        }
      };
    }
  }
}

function syncTopBar(){
  var tb = $("top-bar");
  if (!tb || tb.style.display === "none") return;
  var nav = $("nav"), hud = $("hud"), hudBar = document.querySelector("#hud .bar");
  if (!nav || !hud || !hudBar) return;

  // Tablets and phones: the bar is docked by CSS, the floor just starts below it
  if (FLOOR.cols < 3) {
    tb.style.left = tb.style.width = tb.style.top = "";
    nav.style.width = hudBar.style.width = "";
    var fr = svg.getBoundingClientRect(), pad = FLOOR.padX * fr.width / FLOOR.w;
    tb.style.setProperty("--inset-l", (fr.left + pad) + "px");
    tb.style.setProperty("--inset-r", (innerWidth - fr.right + pad) + "px");
    floor.style.paddingTop = (tb.offsetHeight - 10) + "px";
    return;
  }
  floor.style.paddingTop = "";

  var vbO = ovVB();
  var scale = innerWidth / vbO[2];
  var roomLeft = (30 - vbO[0]) * scale;
  var roomRight = (1170 - vbO[0]) * scale;
  var headerPillTop = (14 - vbO[1]) * scale;
  var totalWidth = roomRight - roomLeft;

  // Ensure nav takes natural content width
  nav.style.width = "max-content";
  var navW = nav.offsetWidth;

  // Never let the bar be narrower than its contents or wider than the screen
  var barW = Math.min(innerWidth - 24, Math.max(totalWidth, navW * 2 + 10));
  roomLeft -= (barW - totalWidth) / 2;
  totalWidth = barW;
  if (navW > 0) {
    hudBar.style.width = Math.min(navW, barW - navW - 10) + "px";
  }

  var barH = Math.max(nav.offsetHeight, hudBar.offsetHeight, 38);
  var topPos = Math.max(12, Math.round((headerPillTop - barH) / 2));

  tb.style.left = Math.round(roomLeft) + "px";
  tb.style.width = Math.round(totalWidth) + "px";
  tb.style.top = topPos + "px";
}

function enter(){

/* Chip Reward: the XP bar waits until the player closes the chip card, then the chip flies up and fills it */
function sparkle(x, y, color, size, dx, dy, ms) {
  var el = document.createElement("div");
  el.className = "reward-spark";
  el.style.width = el.style.height = size + "px";
  el.style.margin = (-size / 2) + "px 0 0 " + (-size / 2) + "px";
  el.style.background = color;
  el.style.boxShadow = "0 0 " + (size * 2) + "px " + color;
  $("fx").appendChild(el);
  el.animate([
    {transform: "translate(" + x + "px," + y + "px) scale(1)", opacity: 1},
    {transform: "translate(" + (x + dx) + "px," + (y + dy) + "px) scale(0.2)", opacity: 0}
  ], {duration: ms, easing: "cubic-bezier(0.16, 1, 0.3, 1)"}).onfinish = function(){ el.remove(); };
}

// Where the filled part of the XP bar currently ends
function xpTip() {
  var r = document.querySelector("#hud .track").getBoundingClientRect();
  return {x: r.left + Math.max(6, r.width * shownN / 6), y: r.top + r.height / 2};
}

function countXp(from, to) {
  var t0 = performance.now(), el = $("xpt");
  cancelAnimationFrame(xpCount);
  (function st(t){
    var p = Math.min(1, (t - t0) / 600), e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (to - from) * e) + " XP · " + P.name;
    if (p < 1) xpCount = requestAnimationFrame(st);
  })(t0);
}

function sparkBurst(x, y, c, count) {
  if (RM) return;
  for (var i = 0; i < count; i++) {
    var a = Math.random() * Math.PI * 2, d = 18 + Math.random() * 34;
    sparkle(x, y, i % 2 ? c.c : "#fde047", 3 + Math.random() * 4, Math.cos(a) * d, Math.sin(a) * d, 480 + Math.random() * 220);
  }
}

function landReward(c, at) {
  shownN++;
  shownXp += 100;
  hud();
  countXp(shownXp - 100, shownXp);
  beep(980);
  sparkBurst(at.x, at.y, c, 14);

  var bar = document.querySelector("#hud .bar");
  bar.animate([
    {transform: "scale(1)"},
    {transform: "scale(" + (RM ? 1 : 1.05) + ")", borderColor: "#fde047", boxShadow: "0 0 30px rgba(250, 204, 21, 0.95), inset 0 0 14px rgba(250, 204, 21, 0.35)", offset: 0.25},
    {transform: "scale(1)"}
  ], {duration: 620, easing: "ease-out"});
  $("xpb").animate([{filter: "brightness(2.4)"}, {filter: "brightness(1)"}], {duration: 800, easing: "ease-out"});
  $("mt-n").animate([{transform: "scale(1)", color: "#fde047"}, {transform: "scale(" + (RM ? 1 : 1.22) + ")", color: "#fde047", offset: 0.3}, {transform: "scale(1)"}], {duration: 520, easing: "ease-out"});

  var label = document.createElement("div");
  label.className = "reward-float";
  label.textContent = "+100 XP";
  $("fx").appendChild(label);
  var br = bar.getBoundingClientRect(), lx = clamp(at.x - 32, br.left + 4, br.right - 76), ly = br.bottom + 4;
  label.animate([
    {transform: "translate(" + lx + "px," + (ly - 6) + "px) scale(0.7)", opacity: 0},
    {transform: "translate(" + lx + "px," + (ly + 6) + "px) scale(1.1)", opacity: 1, offset: 0.2},
    {transform: "translate(" + lx + "px," + (ly + 10) + "px) scale(1)", opacity: 1, offset: 0.7},
    {transform: "translate(" + lx + "px," + (ly + 20) + "px) scale(1)", opacity: 0}
  ], {duration: 1100, easing: "ease-out"}).onfinish = function(){ label.remove(); };
}

// The flight explains where the XP came from, so it always plays. With "reduce motion" on
// (Windows "Show animations" off counts) it stays: just a straight glide without spin or sparks.
function flyReward(c, done) {
  var m = svg.getScreenCTM(), home = chipHome(c);
  var sx = clamp(m.a * home[0] + m.e, 30, innerWidth - 30), sy = clamp(m.d * home[1] + m.f, 30, innerHeight - 30);
  var startScale = clamp(m.a, 0.6, 1.2);
  var el = document.createElement("div");
  el.className = "reward-chip";
  el.innerHTML = '<svg viewBox="-24 -24 48 48" aria-hidden="true">' + chipFace(c) + '</svg>';
  $("fx").appendChild(el);

  // Hold first: the card has only just closed and the eye needs a moment to find the chip
  var POP = 480, first = xpTip(), fly = clamp(Math.hypot(first.x - sx, first.y - sy) * 1.2, 850, 1250);
  var side = first.x < sx ? -1 : 1, t0 = performance.now(), lastSpark = t0;
  var peak = RM ? 1.2 : 1.5, lift = RM ? 0 : 10, swing = RM ? 0 : 70;
  beep(620);
  sparkBurst(sx, sy, c, 10);
  (function st(t){
    var age = t - t0, to = xpTip(), x = sx, y = sy, s, spin = 0;
    if (age < POP) {
      // Pop up in place so the eye catches it before it leaves
      var u = Math.min(1, age / (POP * 0.6));
      s = startScale + (peak - startScale) * Math.sin(u * Math.PI / 2);
      y = sy - lift * Math.sin(u * Math.PI / 2);
    } else {
      // Then swing out on a curve and accelerate into the bar
      var p = Math.min(1, (age - POP) / fly), e = p * p * (1.6 - 0.6 * p), inv = 1 - e;
      var bx = clamp(sx + side * swing + (to.x - sx) * 0.2, 44, innerWidth - 44), by = sy - lift + (to.y - sy) * 0.55;
      x = inv * inv * sx + 2 * inv * e * bx + e * e * to.x;
      y = inv * inv * (sy - lift) + 2 * inv * e * by + e * e * to.y;
      s = peak - (peak - 0.45) * e;
      spin = RM ? 0 : e * 540;
      if (!RM && t - lastSpark > 26) {
        lastSpark = t;
        sparkle(x, y, c.c, 3 + Math.random() * 4, (Math.random() - 0.5) * 22, (Math.random() - 0.5) * 22, 420);
      }
      if (p >= 1) {
        el.remove();
        landReward(c, to);
        // Leave time to watch the bar fill before anything else opens
        setTimeout(done, 1200);
        return;
      }
    }
    el.style.transform = "translate(" + x + "px," + y + "px) scale(" + s + ") rotate(" + spin + "deg)";
    requestAnimationFrame(st);
  })(t0);
}

var activeGameLoop = null, gameCleanup = null, blasterBest = 0;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
// Share of a gap to close in one step, so smoothing feels the same at any frame rate
function ease(rate, h) { return 1 - Math.exp(-rate * h); }

// Keeps a game canvas sharp at its real on-screen size; returns the current drawing scale
function canvasScaler(canvas, W, H) {
  var cssW = 0, scale = 1;
  return function() {
    var w = canvas.clientWidth;
    if (w && w !== cssW) {
      cssW = w;
      var s = w / W * Math.min(window.devicePixelRatio || 1, 2.5);
      canvas.width = Math.round(W * s);
      canvas.height = Math.round(H * s);
      scale = canvas.width / W;
    }
    return scale;
  };
}

function stopActiveGame() {
  if (activeGameLoop) {

    activeGameLoop = null;

}
