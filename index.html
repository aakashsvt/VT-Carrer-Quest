<style>
:root{--bg:#120d2b;--pn:#1f1750;--ink:#f7f3ff;--mut:#b9aee0;--a:#ffd166;--b:#ff4fa3;--c:#39e6c6;--zc:#ffb703;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Nunito,system-ui,sans-serif;overflow:hidden}
h1,h2,h3{font-family:Bungee,Impact,sans-serif;font-weight:400;margin:0;line-height:1.1}
button{font:inherit;cursor:pointer;color:inherit}
svg{display:block}
.layer{position:fixed;inset:0}
.btn{font-family:Bungee,Impact,sans-serif;font-size:15px;border:0;border-radius:10px;padding:13px 22px;background:var(--b);color:#fff}
.btn.alt{background:rgba(31,23,80,.85);box-shadow:inset 0 0 0 2px var(--mut)}
.btn:hover{filter:brightness(1.15)}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.ov{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;overflow:auto}
#welcome{justify-content:space-between;background:linear-gradient(180deg,rgba(11,10,38,.75),transparent 28%,transparent 66%,rgba(11,10,38,.85))}
#welcome h1{font-size:clamp(22px,4.4vw,42px);text-shadow:0 0 26px rgba(255,170,80,.55),0 2px 0 #000}#welcome p{color:var(--mut);margin:6px auto 0;max-width:50ch}
.press{font-size:clamp(20px,3.4vw,28px);padding:11px 40px;background:linear-gradient(180deg,#ffd166,#ff7a45);color:#2a1200;border-radius:14px;box-shadow:0 0 0 4px #2a1200,0 0 0 7px #ffd166,0 10px 40px rgba(255,160,60,.45);animation:pls 1.4s ease-in-out infinite}
@keyframes pls{50%{transform:scale(1.06)}}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#create{background:rgba(11,10,38,.9);display:none}
#create h2{font-size:clamp(20px,4vw,30px)}
input[type=text]{font:800 22px Nunito,sans-serif;text-align:center;background:var(--pn);color:var(--ink);border:3px solid var(--mut);border-radius:12px;padding:12px;width:min(340px,90vw)}
.avs{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:12px;width:min(700px,94vw)}
.av{background:radial-gradient(circle at 50% 80%,rgba(255,209,102,.25),transparent 60%),var(--pn);border:3px solid transparent;border-radius:16px;padding:8px 8px 12px}
.av[aria-pressed=true]{border-color:var(--a);box-shadow:0 0 22px rgba(255,209,102,.5)}
.av svg{width:100%;height:150px}.av .bob{animation:bob 2.4s ease-in-out infinite}
.av b{display:block;font-family:Bungee,sans-serif;font-weight:400;font-size:14px}.av span{font-size:12px;color:var(--mut)}
.plat{fill:rgba(255,209,102,.35)}
@keyframes bob{50%{transform:translateY(-3px)}}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid transparent}.sw[aria-pressed=true]{border-color:#fff;transform:scale(1.15)}
.id{width:min(330px,88vw);border-radius:18px;padding:14px;text-align:left;display:flex;gap:12px;align-items:center;box-shadow:0 12px 40px rgba(0,0,0,.5);animation:pop .6s;border:2px solid rgba(255,255,255,.35)}
.id svg{width:96px;height:110px;flex:none;background:rgba(255,255,255,.28);border-radius:12px}
.id h3{font-size:20px}.id small{display:block;opacity:.9}
@keyframes pop{from{transform:rotateY(90deg) scale(.7);opacity:0}}
#hud{position:fixed;top:0;left:0;right:0;z-index:4;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;display:none;pointer-events:none}
#hud .bar{max-width:520px;background:rgba(18,13,43,.88);border-radius:12px;padding:8px 12px;font-family:Bungee,sans-serif;font-size:13px}
.track{height:8px;background:#352b7a;border-radius:6px;margin-top:6px;overflow:hidden}#xpb{height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--a));transition:width .5s}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:4;display:none;gap:8px;justify-content:center;padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px));flex-wrap:wrap}
#nav .btn{padding:9px 14px;font-size:12px;background:rgba(31,23,80,.94)}
#modal{position:fixed;inset:0;z-index:6;display:none;align-items:flex-end;justify-content:center;padding:12px;pointer-events:none}
.card{pointer-events:auto;background:var(--pn);border:3px solid var(--a);border-radius:18px;padding:20px;width:min(520px,100%);max-height:70vh;overflow:auto;margin-bottom:56px;animation:up .35s}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.card h2{font-size:24px;margin-bottom:8px}.card p{margin:8px 0}
.fact{background:#120d2b;border-radius:10px;padding:10px;border:2px dashed var(--mut)}
.mp{background:linear-gradient(160deg,#0d0a2a,#1b1250);border:2px solid var(--zc);box-shadow:0 0 22px var(--zc),inset 0 0 40px rgba(0,0,0,.5);padding:0;position:relative}
.mp .pt{height:210px;background:radial-gradient(circle at 50% 35%,var(--zc),transparent 72%),#0d0a2a;display:flex;justify-content:center}.mp .pt svg{height:100%}
.mp .pi{padding:16px 18px 18px}.mp small{font-family:Bungee,sans-serif;letter-spacing:.08em;color:var(--mut)}
.mp h2{font-size:26px;margin:2px 0}.mp .dp{color:var(--zc);font-weight:800;filter:brightness(1.4)}
.mp .tg{display:inline-block;margin:8px 0;border:2px solid var(--zc);border-radius:20px;padding:2px 12px;font-size:12px;font-weight:800;background:rgba(255,255,255,.06)}
.mp h4{margin:14px 0 4px;font-size:15px;color:#9fd0ff}
.mp .x{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;border:2px solid var(--zc);background:rgba(13,10,42,.8);color:#fff;font-size:18px}
.mp .bk{width:100%;margin-top:14px;background:transparent;border:2px solid #4d6bff;box-shadow:0 0 14px rgba(77,107,255,.5)}
@media (min-width:760px){.mp{position:fixed;right:16px;top:76px;bottom:64px;margin:0;width:400px;max-height:none}.mp .pt{height:280px}}
.tag{display:inline-block;background:#352b7a;border-radius:20px;padding:2px 10px;font-size:13px;margin:2px}
.jd{margin:8px 0}.jd summary{cursor:pointer;color:var(--a);font-weight:800}.jd ul{padding-left:18px;margin:4px 0;font-size:14px;color:var(--ink)}.jd li{margin:3px 0}.jd h4{margin:12px 0 2px;color:#9fd0ff;font-size:14px}.jd p{font-size:14px}
#careers{background:var(--bg);justify-content:flex-start;z-index:7;display:none}
.jobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;width:min(980px,100%);text-align:left}
.job{background:var(--pn);border-radius:16px;padding:16px;border-top:6px solid var(--b)}.job h3{font-size:19px}.job p{margin:6px 0;color:var(--mut);font-size:14px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--a);color:#241a00;padding:10px 16px;border-radius:10px;z-index:9;display:none;max-width:90vw;font-weight:700}
/* scene animation */
.hit{cursor:pointer}.hit:hover{filter:brightness(1.12)}.hit.sel{filter:drop-shadow(0 0 7px var(--zc))}
.bobg{animation:bob 3s ease-in-out infinite}
.chip .pulse{transform-box:fill-box;transform-origin:center;animation:pz 1.6s ease-in-out infinite}.chip:hover .pulse{filter:brightness(1.3)}
@keyframes pz{50%{transform:scale(1.18)}}
.chip.got{pointer-events:none;transform-box:fill-box;transform-origin:center;animation:gone .7s forwards}
@keyframes gone{to{transform:translateY(-40px) scale(1.6);opacity:0}}
.zoom{transform-origin:500px 380px;animation:zm 14s ease-out forwards}
@keyframes zm{from{transform:scale(.8)}to{transform:scale(1)}}.fl{animation:fl 5s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-12px)}}.cl{animation:cl 26s ease-in-out infinite alternate}@keyframes cl{to{transform:translateX(90px)}}.shoot{animation:sh 9s linear infinite;opacity:0}@keyframes sh{0%{transform:translate(0,0);opacity:0}2%{opacity:1}9%{transform:translate(170px,75px);opacity:0}100%{opacity:0}}
.tw{animation:tw 3s ease-in-out infinite}@keyframes tw{50%{opacity:.25}}
.rot{transform-origin:900px 120px;animation:rt 8s ease-in-out infinite alternate}@keyframes rt{to{transform:rotate(-14deg)}}
.rot2{transform-origin:100px 120px;animation:rt2 9s ease-in-out infinite alternate}@keyframes rt2{to{transform:rotate(14deg)}}
@media (prefers-reduced-motion:reduce){.press,.card,.id,.av .bob,.bobg,.chip .pulse,.zoom,.tw,.rot,.rot2,.fl,.cl,.shoot{animation:none}.zoom{transform:scale(1)}}
</style>
</head>

function act(t){var p=t.closest("[data-p]"),c=t.closest("[data-c]"),q=t.closest("[data-portal]");if(c)collect(+c.dataset.c);else if(p)openEmp(+p.dataset.p,p);else if(q)openCareers()}
svg.addEventListener("click",function(e){if(state==="office")act(e.target)});
svg.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&state==="office"){e.preventDefault();act(e.target)}});
$("start").onclick=function(){state="create";show("welcome",false);show("create",true);step(1)};
$("exp").onclick=openCareers;$("nOv").onclick=close;$("nTeam").onclick=team;$("nJobs").onclick=openCareers;
$("nSnd").onclick=function(){snd=!snd;this.textContent="Sound: "+(snd?"on":"off");this.setAttribute("aria-pressed",snd);beep(520)};
document.addEventListener("keydown",function(e){if(e.key==="Escape"){if($("careers").style.display==="flex")$("careers").style.display="none";else if(state==="office")close()}});
addEventListener("resize",function(){if(state==="office"&&!sel){vb=ovVB();setVB(vb)}});
hq();buildGame();
})();
</script>
